                    thread_id: threadId || '',
                    deal_id: dealId || '',
                    action_type: action,
                })
            });
            const raw = await r.text();
            if (!r.ok) throw new Error(`Webhook responded ${r.status}: ${raw.slice(0, 200)}`);
            const res = parseConvertResponse(raw);
            if (res.kind === 'failed') throw new Error(`Webhook said it did not work: ${raw.slice(0, 200)}`);
            return res;
        }

        // send the contact to the "convert to deal" webhook (one request per click, only for the button that was clicked)
        async function convertToDeal(key, emailId, threadId) {
            if (convertBtnDisabled(key)) return;
            state.convert[key] = { status: 'sending' };
            syncConvertButtons(key);
            try {
                const res = await callWebhook({ action: ACTION_CONVERT, emailId, threadId });
                const status = res.kind === 'created' ? 'created' : res.kind === 'existing' ? 'existing' : 'sent';
                const msg = (res.text && !res.stock) ? res.text : (CONVERT_MSG[status] || 'Request sent');   // a message configured in the webhook wins
                state.convert[key] = { status, msg, dealId: res.dealId || '' };
                syncConvertButtons(key);
                toast(msg, 'ok', status === 'existing' || msg.length > 60 ? 7000 : 4000);
                await refreshMailDeals();                             // the deal may now be linked to the mails of this contact
            } catch (e) {
                console.error(e);
                state.convert[key] = { status: 'error', msg: CONVERT_MSG.failed };
                syncConvertButtons(key);
                toast(CONVERT_MSG.failed, 'err');
            }
        }

        // ── Attach to deal: the deals of this contact in a modal; "Attach" sends the picked one to the same webhook ──
        const ATTACH_MSG = { attached: 'Email attached to the deal', failed: 'Something went wrong' };
        const attachSubject = (key, emailId) => ((state.groupMap.get(key) || {}).latest || {}).subject || (openThread().find(m => m.id === emailId) || {}).subject || '';

        function openAttach(key, emailId, threadId) {
            state.attach = { key, emailId, threadId: threadId || '', subject: attachSubject(key, emailId), status: 'loading', deals: [], selected: '', sending: false, sendError: '', error: '' };
            $('attach-modal').hidden = false;
            loadAttachDeals();
        }
        function closeAttach() {
            state.attach = null;
            $('attach-modal').hidden = true;
        }

        // the query runs every time the modal opens: deals whose associated_contact is this contact
        async function loadAttachDeals() {
            const a = state.attach; if (!a) return;
            a.status = 'loading'; a.error = '';
            renderAttach();
            try {
                const cols = DEAL_LABEL_FIELDS.map((f, i) => `${f} as deal_label_${i}`).join(', ');
                const rows = await query(`SELECT id, ${cols} FROM ${DEAL_OBJECT_SLUG} WHERE ${DEAL_CONTACT_FIELD} = ${sqlStr(scopeId)} ORDER BY created_at DESC LIMIT 100 OFFSET 0`, DEAL_OBJECT_SLUG);
                if (state.attach !== a) return;                        // closed or reopened meanwhile
                a.deals = rows.map(r => {
                    const label = DEAL_LABEL_FIELDS.map((f, i) => String(r['deal_label_' + i] ?? '').trim()).find(Boolean) || r.id;
                    state.dealNames[r.id] = label;                     // already known when the deal chip is drawn after attaching
                    return { id: r.id, label };
                });
                a.status = 'ready';
            } catch (e) {
                if (state.attach !== a) return;
                console.error(e);
                a.status = 'error'; a.error = e.message;
            }
            renderAttach();
        }

        function renderAttach() {
            const a = state.attach; if (!a) return;
            $('am-sub').textContent = a.subject ? `“${a.subject}”` : 'Choose the deal this conversation belongs to';
            let body;
            if (a.status === 'loading') body = '<div class="loader small"></div>';
            else if (a.status === 'error') body = `<div class="empty err">Could not load the deals.<br>${esc(a.error)}<br><br><button class="btn" id="am-retry" type="button">Retry</button></div>`;
            else if (!a.deals.length) body = '<div class="empty">This contact has no deals to attach to.</div>';
            else body = '<div class="am-list" role="radiogroup" aria-label="Deals of this contact">' + a.deals.map(d =>
                `<button type="button" class="am-item ${d.id === a.selected ? 'on' : ''}" role="radio" aria-checked="${d.id === a.selected}" data-deal="${esc(d.id)}"><span class="am-radio"></span><span class="am-name">${esc(d.label)}</span></button>`).join('') + '</div>';
            $('am-body').innerHTML = body;
            $('am-err').textContent = a.sendError || '';
            const btn = $('am-attach');
            btn.disabled = !a.selected || a.sending || a.status !== 'ready';       // enabled only once a deal is picked
            btn.textContent = a.sending ? 'Attaching…' : 'Attach';
        }

        async function attachToDeal() {
            const a = state.attach; if (!a || !a.selected || a.sending) return;
            a.sending = true; a.sendError = '';
            renderAttach();
            try {
                const res = await callWebhook({ action: ACTION_ATTACH, emailId: a.emailId, threadId: a.threadId, dealId: a.selected });
                const msg = (res.text && !res.stock) ? res.text : ATTACH_MSG.attached;                // a message configured in the webhook wins
                closeAttach();
                toast(msg, 'ok', msg.length > 60 ? 7000 : 4000);
                await refreshMailDeals();                                                             // the deal chip replaces the buttons once the mails are linked
            } catch (e) {
                console.error(e);
                if (state.attach === a) { a.sending = false; a.sendError = ATTACH_MSG.failed; renderAttach(); }   // stays open so the user can retry
                toast(ATTACH_MSG.failed, 'err');
            }
        }

        function wireAttach() {
            $('am-close').addEventListener('click', closeAttach);
            $('am-cancel').addEventListener('click', closeAttach);
            $('attach-modal').addEventListener('click', e => { if (e.target === $('attach-modal')) closeAttach(); });     // click on the dark backdrop
            $('am-attach').addEventListener('click', attachToDeal);
            $('am-body').addEventListener('click', e => {
                const a = state.attach; if (!a) return;
                if (e.target.closest('#am-retry')) { loadAttachDeals(); return; }
                const it = e.target.closest('.am-item'); if (!it || a.sending) return;
                a.selected = it.dataset.deal; a.sendError = '';
                renderAttach();
            });
        }

        // ═══════════════════════════════════════════════════════════════
        // THREAD VIEW  (Gmail-style, like the Razorpay timeline modal)
        // ═══════════════════════════════════════════════════════════════
        function attChips(list) {
            if (!list.length) return '';
            return '<div class="atts">' + list.map(u => {
                const n = attName(u);
                return `<a class="att" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(n)}">${clipSvg()}<span class="nm">${esc(n)}</span><span class="ext">${esc(attExt(n))}</span></a>`;
            }).join('') + '</div>';
        }

        function mailItemHtml(m, n) {
            const sp = senderParts(m.from_email);
            const name = sp.name || 'Unknown';
            const [bg, fg] = tintOf(name);
            const av = `<div class="gm-avatar" style="background:${bg};color:${fg}">${esc(initial(name))}</div>`;
            const when = fmtGmail(mailT(m));
            const atts = normAtt(m.attachments);

            if (!state.expanded.has(m.id)) {
                const snip = contentText(m.content || m.html_content).slice(0, 120);
                return `<div class="gm-item collapsed" data-mid="${esc(m.id)}">${av}
                    <div class="gm-main"><div class="gm-name">${esc(name)}</div><div class="gm-snip">${esc(snip)}</div></div>
                    <div class="gm-right">${atts.length ? clipSvg(13) : ''}<span class="gm-date">${esc(when)}</span>${chevSvg}</div></div>`;
            }

            const d = dirOf(m);
            const rc = (label, v) => { const a = extractEmails(v); return a.length ? `<span><b>${label}</b>${a.map(esc).join(', ')}</span>` : ''; };
            const rcpt = [rc('to', m.recipient_email), rc('cc', m.cc), rc('bcc', m.bcc)].join('');
            return `<div class="gm-item expanded" data-mid="${esc(m.id)}">${av}
                <div class="gm-content">
                    <div class="gm-head">
                        <div class="gm-from"><span class="gm-name">${esc(name)}</span>${sp.addr && sp.addr !== name ? `<span class="gm-addr">&lt;${esc(sp.addr)}&gt;</span>` : ''}${d ? `<span class="dir-tag ${d}">${d === 'sent' ? 'Sent' : 'Received'}</span>` : ''}</div>
                        <div class="gm-right"><span class="gm-date" title="${esc(fmtFull(mailT(m)))}">${esc(when)}</span><button class="gm-iconbtn" type="button" data-reply="${esc(m.id)}" title="Reply all" aria-label="Reply all">${REPLY_ALL_SVG}</button>${n > 1 ? `<button class="gm-collapse" type="button" title="Collapse" aria-label="Collapse">${chevUpSvg}</button>` : ''}</div>
                    </div>
                    <div class="gm-deal">${dealAreaHtml(m._dealIds || [], m.id, m.id, m.thread_id || '')}</div>
                    ${rcpt ? `<div class="gm-rcpt">${rcpt}</div>` : ''}
                    ${attChips(atts)}
                    <div class="gm-body" data-mid="${esc(m.id)}"></div>
                    <div class="gm-actions"><button type="button" class="reply-btn" data-reply="${esc(m.id)}">${REPLY_ALL_SVG} Reply all</button></div>
                </div></div>`;
        }

        function threadHtml(mails) {
            const n = mails.length, hidden = n > 5 && !state.showMiddle;     // long threads: first, "N more", last two
            let html = '';
            mails.forEach((m, i) => {
                if (hidden && i >= 1 && i <= n - 3) {
                    if (i === 1) html += `<div class="gm-expander" id="gm-expander" title="Show all messages"><span class="gm-count">${n - 3}</span><span>more messages</span></div>`;
                    return;
                }
                html += mailItemHtml(m, n) + composerHtml(m);
            });
            return html;
        }

        function toggleItem(mid, open) {
            if (open) state.expanded.add(mid); else state.expanded.delete(mid);
            const mails = openThread(), m = mails.find(x => x.id === mid);
            const el = [...$('read').querySelectorAll('.gm-item')].find(e => e.dataset.mid === mid);
            if (!m || !el) return;
            el.outerHTML = mailItemHtml(m, mails.length);
            if (open) mountMailBody(mid);
        }

        async function ensureThread(key, silent = false) {
            const g = state.groupMap.get(key); if (!g) return;
            const cur = state.threads[key];
            if (cur && cur.status !== 'error' && !silent) return;
            if (!silent) {
                state.threads[key] = { status: 'loading' };
                renderRead();
            }
            try {
                const mails = await fetchThread(g);
                if (!mails.length) throw new Error('Conversation not found');
                await ensureDealNames(mails.flatMap(m => m._dealIds));       // names first, so the thread draws once
                state.threads[key] = { status: 'ok', mails, ver: ((cur && cur.ver) || 0) + (silent ? 1 : 0) };
                g.count = Math.max(g.count, mails.length);
                if (state.selected === key) {
                    if (silent) state.expanded.add(mails[mails.length - 1].id);          // a refresh after sending keeps what was open and shows the new mail
                    else { state.expanded = new Set([mails[mails.length - 1].id]); state.showMiddle = false; }
                }
            } catch (e) {
                console.error(e);
                if (!silent) state.threads[key] = { status: 'error', error: e.message };
            }
            if (state.selected === key) { renderRead(); renderList(); }
        }

        function selectThread(key) {
            state.selected = key;
            state.showMiddle = false;
            const t = state.threads[key];
            state.expanded = new Set(t && t.status === 'ok' ? [t.mails[t.mails.length - 1].id] : []);
            renderList();
            renderRead();
            ensureThread(key);
        }

        // ═══════════════════════════════════════════════════════════════
        // REPLY ALL  (composer under each mail: recipients, subject, rich text, attachments and images)
        // ═══════════════════════════════════════════════════════════════
        state.drafts = {};            // mail id -> draft being written
        let _uid = 0;

        const REPLY_ALL_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l-5-5 5-5M12 17l-5-5 5-5M22 18v-2a4 4 0 0 0-4-4H7"/></svg>';
        const IMAGE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

        const authHeaders = () => {
            const h = { 'Authorization': `Bearer ${token}`, 'client-id': CLIENT_ID, 'client-secret': CLIENT_SECRET };
            if (PLATFORM_ID) h['platform-id'] = PLATFORM_ID;
            return h;
        };
        // replies are always sent FROM the logged-in user (REPLY_FROM can force another address)
        const fromAddr = () => REPLY_FROM || state.me.email;
        const senderNameFor = from => from.toLowerCase() === state.me.email.toLowerCase() ? (state.me.name || from) : from;
        const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
        const dedupe = list => { const seen = new Set(); return list.filter(a => { const k = String(a).toLowerCase(); if (!a || seen.has(k)) return false; seen.add(k); return true; }); };
        const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
        const fmtAttr = v => {
            const d = toDate(v); if (!d) return '';
            return d.toLocaleString('en-GB', { ...TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
        };

        function toast(msg, kind, ms = 3500) {
            let t = $('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
            t.textContent = msg;
            t.className = 'toast show' + (kind === 'err' ? ' err' : '');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => { t.className = 'toast'; }, ms);
        }

        // the reply goes to the contact; everyone else who was on the mail (sender, To, Cc) stays in Cc, minus you and the contact. Bcc is never copied.
        function replyTargets(m, from) {
            const low = a => a.toLowerCase();
            const skip = new Set([state.me.email, from, ...contactAddrs].map(low));
            const cc = dedupe([...extractEmails(m.from_email), ...extractEmails(m.recipient_email), ...extractEmails(m.cc)].filter(a => !skip.has(low(a))));
            return { to: [contactAddrs[0]], cc };
        }

        function newDraft(m) {
            const subj = String(m.subject || '').trim();
            const t = replyTargets(m, fromAddr());
            return { open: true, from: fromAddr(), to: t.to, cc: t.cc, bcc: [], showBcc: false, subject: /^\s*re\s*:/i.test(subj) ? subj : 'Re: ' + subj,
                html: '', quote: true, files: [], uploading: 0, sending: false, error: '' };
        }

        const composerEl = mid => [...$('read').querySelectorAll('.gm-compose')].find(e => e.dataset.cid === mid);
        const itemEl = mid => [...$('read').querySelectorAll('.gm-item')].find(e => e.dataset.mid === mid);

        const chipsHtml = (field, list) => list.map((a, i) =>
            `<span class="cp-chip">${esc(a)}<button type="button" class="cp-x" data-field="${field}" data-i="${i}" aria-label="Remove ${esc(a)}">×</button></span>`).join('');

        const filesHtml = d => d.files.map(f =>
            `<span class="cp-file ${f.status}" title="${esc(f.error || f.name)}">${f.status === 'uploading' ? '<span class="cp-spin"></span>' : clipSvg(13)}<span class="cp-fn">${esc(f.name)}</span><span class="cp-fs">${f.status === 'error' ? 'failed' : fmtSize(f.size)}</span><button type="button" class="cp-file-x" data-fid="${f.id}" aria-label="Remove">×</button></span>`).join('');

        function composerHtml(m) {
            const d = state.drafts[m.id];
            if (!d || !d.open) return '';
            const row = (label, field, list, extra) =>
                `<div class="cp-row"><span class="cp-l">${label}</span><div class="cp-chips" data-field="${field}">${chipsHtml(field, list)}<input class="cp-input" data-field="${field}" type="text" placeholder="${list.length ? '' : 'name@example.com'}" autocomplete="off"></div>${extra || ''}</div>`;
            return `<div class="gm-compose" data-cid="${esc(m.id)}">
                <div class="cp-top"><span class="cp-title">Reply all</span><button type="button" class="cp-close" title="Discard" aria-label="Discard">×</button></div>
                <div class="cp-row"><span class="cp-l">From</span><input class="cp-fromin" type="text" value="${esc(d.from)}" readonly spellcheck="false" title="Replies are sent from your own email"></div>
                ${row('To', 'to', d.to)}
                ${row('Cc', 'cc', d.cc, d.showBcc ? '' : '<button type="button" class="cp-link cp-bcc-toggle">Bcc</button>')}
                ${d.showBcc ? row('Bcc', 'bcc', d.bcc) : ''}
                <div class="cp-row"><span class="cp-l">Subject</span><input class="cp-subject" type="text" value="${esc(d.subject)}"></div>
                <div class="cp-editor" contenteditable="true" data-placeholder="Write your reply…"></div>
                <label class="cp-quote"><input type="checkbox" class="cp-quote-cb" ${d.quote ? 'checked' : ''}> Include the original message below your reply</label>
                <div class="cp-files">${filesHtml(d)}</div>
                <div class="cp-bar">
                    <div class="cp-tools">
                        <button type="button" class="cp-fmt" data-cmd="bold" title="Bold"><b>B</b></button>
                        <button type="button" class="cp-fmt" data-cmd="italic" title="Italic"><i>I</i></button>
                        <button type="button" class="cp-fmt" data-cmd="underline" title="Underline"><u>U</u></button>
                        <button type="button" class="cp-fmt" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
                        <button type="button" class="cp-fmt" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
                        <span class="cp-sep"></span>
                        <button type="button" class="cp-tool cp-attach" title="Attach files" aria-label="Attach files">${clipSvg(16)}</button>
                        <button type="button" class="cp-tool cp-image" title="Insert image" aria-label="Insert image">${IMAGE_SVG}</button>
                    </div>
                    <div class="cp-err">${esc(d.error)}</div>
                    <div class="cp-actions">
                        <button type="button" class="btn cp-discard">Discard</button>
                        <button type="button" class="cp-send" ${d.sending || d.uploading ? 'disabled' : ''}>${d.sending ? 'Sending…' : 'Send'}</button>
                    </div>
                </div>
                <input type="file" class="cp-file-input" multiple hidden>
                <input type="file" class="cp-image-input" accept="image/*" multiple hidden>
            </div>`;
        }

        // put the saved text back into a freshly drawn composer
        function mountComposer(mid) {
            const c = composerEl(mid), d = state.drafts[mid]; if (!c || !d) return;
            c.querySelector('.cp-editor').innerHTML = d.html;
        }
        const mountComposers = () => [...$('read').querySelectorAll('.gm-compose')].forEach(c => mountComposer(c.dataset.cid));

        function openComposer(mid) {
            const m = openThread().find(x => x.id === mid); if (!m) return;
            if (!state.drafts[mid]) state.drafts[mid] = newDraft(m);
            state.drafts[mid].open = true;
            let c = composerEl(mid);
            if (!c) {
                const it = itemEl(mid); if (!it) return;
                it.insertAdjacentHTML('afterend', composerHtml(m));
                mountComposer(mid);
                c = composerEl(mid);
            }
            const ed = c.querySelector('.cp-editor');
            ed.focus();
            if (c.scrollIntoView) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        function closeComposer(mid) {
            delete state.drafts[mid];
            const c = composerEl(mid); if (c) c.remove();
        }

        function setErr(mid, msg) {
            const d = state.drafts[mid], c = composerEl(mid); if (!d) return;
            d.error = msg || '';
            if (c) c.querySelector('.cp-err').textContent = d.error;
        }
        function syncSend(mid) {
            const d = state.drafts[mid], c = composerEl(mid); if (!d || !c) return;
            const b = c.querySelector('.cp-send');
            b.disabled = !!(d.sending || d.uploading);
            b.textContent = d.sending ? 'Sending…' : 'Send';
        }
        function renderChips(mid, field) {
            const c = composerEl(mid), d = state.drafts[mid]; if (!c || !d) return;
            const box = c.querySelector(`.cp-chips[data-field="${field}"]`);
            box.querySelectorAll('.cp-chip').forEach(x => x.remove());
            box.insertAdjacentHTML('afterbegin', chipsHtml(field, d[field]));
        }
        function commitField(mid, field) {
            const c = composerEl(mid), d = state.drafts[mid]; if (!c || !d) return;
            const inp = c.querySelector(`.cp-input[data-field="${field}"]`);
            const bad = [];
            inp.value.split(/[,;\s]+/).map(s => s.trim()).filter(Boolean).forEach(p => {
                if (!isEmail(p)) bad.push(p);
                else if (!d[field].some(x => x.toLowerCase() === p.toLowerCase())) d[field].push(p);
            });
            inp.value = bad.join(', ');
            inp.closest('.cp-chips').classList.toggle('invalid', bad.length > 0);
            renderChips(mid, field);
        }
        function refreshFiles(mid) {
            const d = state.drafts[mid], c = composerEl(mid); if (!d || !c) return;
            c.querySelector('.cp-files').innerHTML = filesHtml(d);
            syncSend(mid);
        }

        // ── uploads (attachments and inline images share the same upload endpoint) ──
        function pickUploadUrl(j) {
            let d = j && (j.data !== undefined ? j.data : j);
            if (Array.isArray(d)) d = d[0];
            if (typeof d === 'string') return d;
            if (!d) return '';
            const c = [d.url, d.file_url, d.link, d.public_url, d.location, d.path, d.file && d.file.url, d.data && d.data.url];
            return c.find(x => typeof x === 'string' && x) || '';
        }
        async function uploadFile(file) {
            const fd = new FormData();
            fd.append('file', file, file.name);
            fd.append('is_private', 'false');
            const r = await fetch(UPLOAD_URL, { method: 'POST', headers: authHeaders(), body: fd });   // the browser sets the multipart boundary
            const raw = await r.text();
            let j = null; try { j = JSON.parse(raw); } catch (e) { }
            if (!r.ok || (j && j.success === false)) throw new Error((j && ((j.data && j.data.message) || j.message)) || `Upload failed (${r.status})`);
            const url = pickUploadUrl(j);
            if (!url) { console.warn('Upload response', j || raw); throw new Error('Uploaded, but no file link came back'); }
            return { name: file.name, size: file.size, type: (file.type || '').split('/')[1] || '', url };
        }

        function insertImage(mid, url, alt) {
            const d = state.drafts[mid], c = composerEl(mid); if (!d) return;
            const img = `<img src="${esc(url)}" alt="${esc(alt)}" style="max-width:100%;height:auto">`;
            if (!c) { d.html += img; return; }
            const ed = c.querySelector('.cp-editor');
            ed.focus();
            const sel = window.getSelection();
            if (!sel.rangeCount || !ed.contains(sel.anchorNode)) {      // no caret inside the editor: add at the end
                const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
                sel.removeAllRanges(); sel.addRange(r);
            }
            let done = false;
            try { done = document.execCommand('insertHTML', false, img); } catch (e) { }
            if (!done) ed.insertAdjacentHTML('beforeend', img);
            d.html = ed.innerHTML;
        }

        async function addFiles(mid, files, asImage) {
            const d = state.drafts[mid]; if (!d) return;
            for (const file of files) {
                const rec = { id: ++_uid, name: file.name, size: file.size, status: 'uploading' };
                d.uploading++;
                if (!asImage) { d.files.push(rec); refreshFiles(mid); } else syncSend(mid);
                try {
                    const up = await uploadFile(file);
                    if (asImage) insertImage(mid, up.url, file.name);
                    else { rec.url = up.url; rec.type = up.type; rec.status = 'ok'; }
                } catch (e) {
                    console.error(e);
                    rec.status = 'error'; rec.error = e.message;
                    setErr(mid, `Could not upload ${file.name}: ${e.message}`);
                    if (asImage) { /* nothing was added to the message */ }
                } finally {
                    d.uploading--;
                    if (!asImage) refreshFiles(mid); else syncSend(mid);
                }
            }
        }

        // ── send ──
        // the original message goes below the reply as a quote: drop the page wrapper and the open-tracking pixel,
        // otherwise the original sender's "opened" tracking fires again whenever the reply is opened
        function cleanQuote(html) {
            return String(html)
                .replace(/<!DOCTYPE[^>]*>/gi, '')
                .replace(/<head[\s\S]*?<\/head>/gi, '')
                .replace(/<\/?(html|body)\b[^>]*>/gi, '')
                .replace(/<script[\s\S]*?<\/script>/gi, '')
                .replace(/<img\b[^>]*>/gi, tag => {
                    const src = (tag.match(/\bsrc\s*=\s*["']([^"']*)["']/i) || [])[1] || '';
                    const w = (tag.match(/(?<![\w-])width\s*[=:]\s*["']?(\d+)/i) || [])[1];
                    const h = (tag.match(/(?<![\w-])height\s*[=:]\s*["']?(\d+)/i) || [])[1];
                    const tracker = /\/email\/open\b|mailtrack\.io|\/track(ing)?\//i.test(src);
                    const pixel = w !== undefined && h !== undefined && +w <= 1 && +h <= 1;
                    return tracker || pixel ? '' : tag;
                })
                .trim();
        }

        function buildReplyBody(m, d) {
            let html = `<div class="paragraph">${d.html}</div>`;
            if (d.quote) {
                const addr = extractEmails(m.from_email)[0] || senderParts(m.from_email).addr;
                const nm = senderParts(m.from_email).name;
                const who = (nm && nm !== addr ? esc(nm) + ' ' : '') + `&lt;${esc(addr)}&gt;`;
                const orig = cleanQuote(pickBody(m).html);
                html += `<div class="gmail_attr" style="font-size:0.85em;">On ${esc(fmtAttr(mailT(m)))}, ${who} wrote:</div>` +
                    `<blockquote class="gmail_quote" style="border-left:1px solid #ccc;padding-left:1ex;margin:0 0 0 0.8ex;">${orig}</blockquote>`;
            }
            return html;
        }

        // build the request body for one recipient shape
        function replyPayload(m, d, shape) {
            return {
                record_context: replyRecordContext(m),
                custom_emails: d.to.map(a => ({ to: a })),
                cc: d.cc.map(shape),
                bcc: d.bcc.map(shape),
                parent_email_id: m.id,
                from: d.from,
                sender_name: senderNameFor(d.from),
                subject: d.subject,
                body: buildReplyBody(m, d),
                content_type: 'text/html',
                attachments: d.files.filter(f => f.status === 'ok').map(ATTACHMENT_PAYLOAD),
            };
        }

        let _shape = 0;   // index of the Cc/Bcc shape the API accepted last time
        async function postReply(m, d) {
            const hasCopies = d.cc.length || d.bcc.length;
            for (let i = _shape; i < RECIPIENT_SHAPES.length; i++) {
                const r = await fetch(SEND_URL, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(replyPayload(m, d, RECIPIENT_SHAPES[i])) });
                const raw = await r.text();
                let j = null; try { j = JSON.parse(raw); } catch (e) { }
                if (r.ok && !(j && j.success === false)) { if (hasCopies) _shape = i; return; }
                const msg = (j && ((j.data && j.data.message) || j.message)) || `Send failed (${r.status})`;
                // a 400 type error means nothing was sent, so the next shape can be tried safely
                const typeError = r.status === 400 && /unmarshal|SendTo/i.test(msg);
                if (!(hasCopies && typeError && i < RECIPIENT_SHAPES.length - 1)) throw new Error(msg);
            }
        }

        async function sendReply(mid) {
            const d = state.drafts[mid], m = openThread().find(x => x.id === mid), c = composerEl(mid);
            if (!d || !m || !c || d.sending) return;
            ['to', 'cc', 'bcc'].forEach(f => { const i = c.querySelector(`.cp-input[data-field="${f}"]`); if (i && i.value.trim()) commitField(mid, f); });
            const ed = c.querySelector('.cp-editor');
            d.html = ed.innerHTML;
            d.subject = c.querySelector('.cp-subject').value.trim();
            d.from = c.querySelector('.cp-fromin').value.trim();
            if (!isEmail(d.from)) return setErr(mid, 'Enter a valid From address.');
            if (c.querySelector('.cp-chips.invalid')) return setErr(mid, 'Fix or remove the invalid email address.');
            if (!d.to.length) return setErr(mid, 'Add at least one recipient.');
            if (!d.subject) return setErr(mid, 'Add a subject.');
            if (!ed.textContent.trim() && !ed.querySelector('img')) return setErr(mid, 'Write a message first.');
            if (d.uploading) return setErr(mid, 'Wait for the uploads to finish.');
            if (d.files.some(f => f.status === 'error')) return setErr(mid, 'Remove the files that failed to upload.');

            setErr(mid, '');
            d.sending = true; syncSend(mid);
            const key = state.selected;
            try {
                await postReply(m, d);
                closeComposer(mid);
                toast('Reply sent');
                refreshThreadAfterSend(key);
            } catch (e) {
                console.error(e);
                d.sending = false; syncSend(mid);
                setErr(mid, e.message);
            }
        }

        // after a send, reload the open conversation ONCE (a short wait gives the platform time to store the sent mail)
        async function refreshThreadAfterSend(key) {
            await sleep(1500);
            await ensureThread(key, true);
        }

        // bold / italic / underline / lists. Lists have a manual fallback for browsers where execCommand does not build them.
        function listFallback(ed, ordered) {
            const sel = window.getSelection();
            const inside = sel.rangeCount && ed.contains(sel.anchorNode);
            const r = inside ? sel.getRangeAt(0) : null;
            let text = '';
            if (r) {                                                            // <br> and block ends count as line breaks (Range.toString() would drop them)
                const tmp = document.createElement('div');
                tmp.appendChild(r.cloneContents());
                tmp.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
                tmp.querySelectorAll('div,p,li').forEach(el => el.insertAdjacentText('afterend', '\n'));
                text = tmp.textContent;
            }
            const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
            const list = document.createElement(ordered ? 'ol' : 'ul');
            (lines.length ? lines : ['']).forEach(t => {
                const li = document.createElement('li');
                if (t) li.textContent = t; else li.innerHTML = '<br>';
                list.appendChild(li);
            });
            if (r) { r.deleteContents(); r.insertNode(list); } else ed.appendChild(list);
            const rr = document.createRange();                                 // caret at the end of the last item, ready to type
            rr.selectNodeContents(list.lastChild); rr.collapse(false);
            sel.removeAllRanges(); sel.addRange(rr);
        }
        function applyFormat(ed, cmd) {
            ed.focus();
            const before = ed.innerHTML;
            let ok = false;
            try { ok = document.execCommand(cmd, false, null); } catch (e) { }
            if ((cmd === 'insertUnorderedList' || cmd === 'insertOrderedList') && (!ok || ed.innerHTML === before)) listFallback(ed, cmd === 'insertOrderedList');
        }

        // clicks inside the reading pane that belong to reply / composer; returns true when handled
        function handleComposerClick(e) {
            const rep = e.target.closest('[data-reply]');
            if (rep) { openComposer(rep.dataset.reply); return true; }
            const c = e.target.closest('.gm-compose'); if (!c) return false;
            const mid = c.dataset.cid, d = state.drafts[mid]; if (!d) return true;
            if (e.target.closest('.cp-close, .cp-discard')) { closeComposer(mid); return true; }
            if (e.target.closest('.cp-send')) { sendReply(mid); return true; }
            if (e.target.closest('.cp-attach')) { c.querySelector('.cp-file-input').click(); return true; }
            if (e.target.closest('.cp-image')) { c.querySelector('.cp-image-input').click(); return true; }
            const fmt = e.target.closest('.cp-fmt');
            if (fmt) {
                const ed = c.querySelector('.cp-editor');
                applyFormat(ed, fmt.dataset.cmd);
                d.html = ed.innerHTML;
                return true;
            }
            const x = e.target.closest('.cp-x');
            if (x) { d[x.dataset.field].splice(+x.dataset.i, 1); renderChips(mid, x.dataset.field); return true; }
            const fx = e.target.closest('.cp-file-x');
            if (fx) { d.files = d.files.filter(f => String(f.id) !== fx.dataset.fid); refreshFiles(mid); return true; }
            if (e.target.closest('.cp-bcc-toggle')) {
                const m = openThread().find(y => y.id === mid);
                d.html = c.querySelector('.cp-editor').innerHTML; d.subject = c.querySelector('.cp-subject').value;
                d.showBcc = true;
                c.outerHTML = composerHtml(m);
                mountComposer(mid);
                return true;
            }
            return true;
        }

        function wireComposer() {
            const read = $('read');
            read.addEventListener('mousedown', e => { if (e.target.closest('.cp-fmt')) e.preventDefault(); });   // keep the selection in the editor
            read.addEventListener('input', e => {
                const c = e.target.closest('.gm-compose'); if (!c) return;
                const d = state.drafts[c.dataset.cid]; if (!d) return;
                if (e.target.matches('.cp-editor')) d.html = e.target.innerHTML;
                else if (e.target.matches('.cp-subject')) d.subject = e.target.value;
                else if (e.target.matches('.cp-fromin')) d.from = e.target.value.trim();
                else if (e.target.matches('.cp-input') && /[,;\s]/.test(e.target.value)) commitField(c.dataset.cid, e.target.dataset.field);
            });
            read.addEventListener('keydown', e => {
                const c = e.target.closest('.gm-compose'); if (!c) return;
                const mid = c.dataset.cid, d = state.drafts[mid];
                if (e.target.matches('.cp-editor') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendReply(mid); return; }
                const inp = e.target.closest('.cp-input'); if (!inp || !d) return;
                const field = inp.dataset.field;
                if (e.key === 'Enter' || e.key === ',' || e.key === ';') { e.preventDefault(); commitField(mid, field); }
                else if (e.key === 'Backspace' && !inp.value && d[field].length) { d[field].pop(); renderChips(mid, field); }
            });
            read.addEventListener('focusout', e => {
                const inp = e.target.closest && e.target.closest('.cp-input');
                if (inp && inp.value.trim()) commitField(inp.closest('.gm-compose').dataset.cid, inp.dataset.field);
            });
            read.addEventListener('change', e => {
                const c = e.target.closest('.gm-compose'); if (!c) return;
                const mid = c.dataset.cid, d = state.drafts[mid]; if (!d) return;
                if (e.target.matches('.cp-quote-cb')) d.quote = e.target.checked;
                else if (e.target.matches('.cp-file-input')) { addFiles(mid, [...e.target.files], false); e.target.value = ''; }
                else if (e.target.matches('.cp-image-input')) { addFiles(mid, [...e.target.files], true); e.target.value = ''; }
            });
            read.addEventListener('paste', e => {                    // pasted screenshots / images are uploaded and inserted inline
                const ed = e.target.closest && e.target.closest('.cp-editor'); if (!ed) return;
                const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));
                if (files.length) { e.preventDefault(); addFiles(ed.closest('.gm-compose').dataset.cid, files, true); }
            });
        }

        // which record the sent mail is attached to: the mail's deal when it has one, otherwise the contact
        function replyRecordContext(m) {
            const deal = (m._dealIds || [])[0];
            return deal ? { object_slug: DEAL_OBJECT_SLUG, record_id: deal, batch_recipients: {} }
                : { object_slug: contactSlug, record_id: scopeId, batch_recipients: {} };
        }

        // ═══════════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════════
        function renderSub() {
            if (!state.me) return;
            const base = scopeSub();
            if (!state.loaded) { $('sub').textContent = base; return; }
            const n = visibleGroups().length;
            $('sub').textContent = `${base} · ${n}${state.done ? '' : '+'} conversation${n === 1 && state.done ? '' : 's'}`;
        }

        function renderActive() {
            const items = [];
            const db = dateBounds();
            if (state.filters.attach) items.push(['attach', 'Has attachment']);
            if (db) items.push(['date', `Date: ${db.a === db.b ? fmtDay(db.a) : fmtDay(db.a) + ' – ' + fmtDay(db.b)}`]);
            const cnt = $('filter-count');
            cnt.textContent = items.length; cnt.hidden = !items.length;
            const bar = $('activebar');
            bar.hidden = !items.length;
            bar.innerHTML = items.map(([k, l]) => `<span class="fchip">${esc(l)}<button type="button" data-clear="${k}" aria-label="Remove filter">×</button></span>`).join('') +
                (items.length > 1 ? '<button class="flink" type="button" data-clear="all">Clear all</button>' : '');
        }

        function whoOf(g) {
            const m = g.latest;
            if (dirOf(m) === 'sent') {
                const r = extractEmails(m.recipient_email);
                return { label: 'To: ' + (r[0] || '(no recipient)') + (r.length > 1 ? ` +${r.length - 1}` : ''), init: r[0] || '?' };
            }
            const n = senderParts(m.from_email).name || '(unknown sender)';
            return { label: n, init: n };
        }

        function renderList() {
            const list = $('list');
            if (!state.loaded && state.loading) { list.innerHTML = '<div class="loader"></div>'; return; }
            if (state.error && !state.groups.length) { list.innerHTML = `<div class="empty err">Could not load mails.<br>${esc(state.error)}</div>`; return; }

            const rows = visibleGroups(), tokens = searchTokens();
            if (!rows.length) {
                list.innerHTML = `<div class="empty">${filtersActive() ? 'No conversations match your search or filters.' : 'No mails found for this ' + SCOPE_LABEL + '.'}</div>` + moreHtml();
                return;
            }
            let html = '', lastDay = '';
            rows.forEach(g => {
                const dk = dayKeyOf(g.time);
                if (dk !== lastDay) { html += `<div class="day-head">${esc(dayLabel(g.time))}</div>`; lastDay = dk; }
                const w = whoOf(g), d = dirOf(g.latest), replies = g.count - 1;
                html += `<div class="row ${g.key === state.selected ? 'sel' : ''}" data-key="${esc(g.key)}">
                    <div class="avatar">${esc(initial(w.init))}</div>
                    <div class="row-main">
                        <div class="row-top">
                            <div class="row-who">${esc(w.label)}</div>
                            <div class="row-meta">${g.atts ? clipSvg(13) : ''}<span class="row-date">${esc(fmtTime(g.time))}</span></div>
                        </div>
                        <div class="row-subj">${hl(g.latest.subject || '(no subject)', tokens)}</div>
                        ${matchHint(g, tokens)}
                        ${d || replies > 0 ? `<div class="row-tags">${d ? `<span class="dir-tag ${d}">${d === 'sent' ? 'Sent' : 'Received'}</span>` : ''}${replies > 0 ? `<span class="reply-badge">${replies} ${replies === 1 ? 'reply' : 'replies'}</span>` : ''}</div>` : ''}
                        <div class="row-deal">${dealAreaHtml(g.dealIds, g.key, g.latest.id, g.threadId)}</div>
                    </div>
                </div>`;
            });
            list.innerHTML = html + moreHtml();
        }

        function moreHtml() {
            if (state.error && state.groups.length) return `<div class="more"><div style="color:#b91c1c;font-size:12px;margin-bottom:8px">${esc(state.error)}</div><button class="btn" id="more-btn">Retry</button></div>`;
            if (state.done) return '';
            const note = (searchTokens().length || state.filters.attach) ? '<div class="more-note">Search and attachment filters apply to the conversations loaded so far.</div>' : '';
            return `<div class="more">${note}<button class="btn" id="more-btn" ${state.loading ? 'disabled' : ''}>${state.loading ? 'Loading…' : 'Load more'}</button></div>`;
        }

        let _readKey = 'none';   // skip re-rendering the reading pane when nothing about it changed (keeps scroll position)

        function renderRead() {
            const g = state.groupMap.get(state.selected);
            const t = g ? state.threads[state.selected] : null;
            const key = g ? `${state.selected}|${t ? t.status : 'none'}|${state.showImages}|${state.showMiddle}|${t ? (t.ver || 0) : 0}|${state.dealVer}` : 'none';
            if (key === _readKey) return;
            _readKey = key;

            if (!g) { $('read').innerHTML = '<div class="empty">Select a conversation to read it</div>'; return; }

            if (!t || t.status === 'loading') {
                $('read').innerHTML = `<div class="read-subj">${esc(g.latest.subject || '(no subject)')}</div><div class="loader small"></div>`;
                return;
            }
            if (t.status === 'error') {
                $('read').innerHTML = `<div class="read-subj">${esc(g.latest.subject || '(no subject)')}</div><div class="empty err">Could not load the conversation.<br>${esc(t.error)}<br><br><button class="btn" id="retry-thread">Retry</button></div>`;
                return;
            }
            const mails = t.mails, n = mails.length;
            const subject = (mails.find(m => m.subject) || {}).subject || g.latest.subject || '(no subject)';
            const notice = !state.showImages && mails.some(m => pickBody(m).hasRemoteImg)
                ? `<div class="notice" style="margin:0 0 14px"><span>Remote images are blocked to protect your privacy.</span><button id="show-img" type="button">Show images</button></div>` : '';
            $('read').innerHTML = `<div class="read-subj">${esc(subject)}</div><div class="read-sub">${n} message${n === 1 ? '' : 's'}</div>${notice}<div class="thread">${threadHtml(mails)}</div>`;
            state.expanded.forEach(mountMailBody);
            mountComposers();
        }

        function render() {
            renderSub();
            renderActive();
            renderList();
            renderRead();
            $('refresh-btn').classList.toggle('spinning', state.loading);
        }

        // ═══════════════════════════════════════════════════════════════
        // FILTERS: attachment toggle, date pills + custom calendar (state keeps 'YYYY-MM-DD', the UI shows DD/MM/YYYY)
        // ═══════════════════════════════════════════════════════════════
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
        const cal = { y: 0, m: 0, target: 'from' };     // month being viewed (m is 0-11) + which pill is being picked
        const pad = n => String(n).padStart(2, '0');
        const dayKey = (y, m1, d) => y * 10000 + m1 * 100 + d;
        const toDMY = iso => iso ? iso.split('-').reverse().join('/') : '';

        function parseDMY(txt) {
            const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(txt).trim());
            if (!m) return null;
            const d = +m[1], mo = +m[2], y = +m[3];
            const chk = new Date(Date.UTC(y, mo - 1, d));
            if (y < 1970 || chk.getUTCFullYear() !== y || chk.getUTCMonth() !== mo - 1 || chk.getUTCDate() !== d) return null;
            return `${y}-${pad(mo)}-${pad(d)}`;
        }
        function istToday() {
            const d = new Date(Date.now() + IST_MS);
            return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
        }

        function syncFilterInputs() {
            const on = state.filters.attach;
            $('att-toggle').classList.toggle('on', on);
            $('att-toggle').setAttribute('aria-pressed', String(on));
            ['from', 'to'].forEach(k => {
                const el = $('f-' + k);
                if (document.activeElement !== el) el.value = toDMY(state.filters[k]);   // don't overwrite text being typed
            });
        }

        let dateTimer;
        function setDateFilter(target, iso) {
            if (state.filters[target] === iso) return;
            state.filters[target] = iso;
            syncFilterInputs();
            renderActive();
            clearTimeout(dateTimer);
            dateTimer = setTimeout(() => { if (state.scopeReady) reload(); }, 250);      // the date range is part of the query
        }

        function clearFilter(k) {
            let dateChanged = false;
            if (k === 'attach' || k === 'all') state.filters.attach = false;
            if (k === 'date' || k === 'all') {
                dateChanged = !!(state.filters.from || state.filters.to);
                state.filters.from = ''; state.filters.to = '';
            }
            syncFilterInputs();
            if (dateChanged) reload(); else render();
        }

        function renderCalendar() {
            const t = istToday(), todayK = dayKey(t.y, t.m, t.d);
            const iso = state.filters[cal.target], selK = iso ? +iso.replace(/-/g, '') : null;
            const firstDow = new Date(Date.UTC(cal.y, cal.m, 1)).getUTCDay();
            const dim = new Date(Date.UTC(cal.y, cal.m + 1, 0)).getUTCDate();
            let cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
            for (let i = 0; i < firstDow; i++) cells += '<div></div>';
            for (let d = 1; d <= dim; d++) {
                const k = dayKey(cal.y, cal.m + 1, d);
                const cls = ['cal-day', k === todayK ? 'today' : '', k === selK ? 'sel' : ''].filter(Boolean).join(' ');
                cells += `<button type="button" class="${cls}" data-d="${d}">${d}</button>`;
            }
            const chev = dir => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${dir < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6'}"/></svg>`;
            $('cal-view').innerHTML = `
                <div class="cal-title">${cal.target === 'from' ? 'Start date' : 'End date'}</div>
                <div class="cal-head">
                    <button type="button" class="cal-nav" data-nav="-1" aria-label="Previous month">${chev(-1)}</button>
                    <div class="cal-month">${MONTHS[cal.m]} ${cal.y}</div>
                    <button type="button" class="cal-nav" data-nav="1" aria-label="Next month">${chev(1)}</button>
                </div>
                <div class="cal-grid">${cells}</div>
                <div class="cal-foot">
                    <button type="button" class="cal-link" data-today="1">Today</button>
                    <span>
                        <button type="button" class="cal-link muted" data-cclear="1">Clear</button>
                        <button type="button" class="cal-link muted" data-back="1">Back</button>
                    </span>
                </div>`;
        }
        function openCal(target) {
            cal.target = target;
            const t = istToday();
            const iso = state.filters[target] || state.filters[target === 'from' ? 'to' : 'from'];
            if (iso) { const [y, m] = iso.split('-').map(Number); cal.y = y; cal.m = m - 1; }
            else { cal.y = t.y; cal.m = t.m - 1; }
            renderCalendar();
            $('pop-main').hidden = true;
            $('cal-view').hidden = false;
        }
        function closeCal() {
            $('cal-view').hidden = true;
            $('pop-main').hidden = false;
        }
        // closes the whole More filters popover (outside clicks, including clicks inside a mail body iframe)
        function closeFilters() {
            closeCal();
            $('filter-pop').hidden = true;
            const mb = $('more-filters-btn');
            mb.classList.remove('open');
            mb.setAttribute('aria-expanded', 'false');
        }

        // ═══════════════════════════════════════════════════════════════
        // EVENTS
        // ═══════════════════════════════════════════════════════════════
        async function refreshAll() {
            if (!state.me) return;
            if (!state.scopeReady) {
                try { await prepareScope(); state.scopeReady = true; }
                catch (e) { console.error(e); $('list').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
            }
            return reload();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            $('search').addEventListener('input', e => { state.filters.search = e.target.value; renderSub(); renderList(); });
            $('list').addEventListener('click', e => {
                if (e.target.closest('#more-btn')) { loadMore(); return; }
                const cb = e.target.closest('[data-convert]'); if (cb) { e.stopPropagation(); convertToDeal(cb.dataset.convert, cb.dataset.email, cb.dataset.thread); return; }
                const ab = e.target.closest('[data-attach]'); if (ab) { e.stopPropagation(); openAttach(ab.dataset.attach, ab.dataset.email, ab.dataset.thread); return; }
                if (e.target.closest('a.deal-chip')) return;                 // open the deal, don't select the row
                const row = e.target.closest('.row'); if (!row) return;
                selectThread(row.dataset.key);
            });
            $('read').addEventListener('click', e => {
                if (handleComposerClick(e)) return;
                const cb = e.target.closest('[data-convert]'); if (cb) { convertToDeal(cb.dataset.convert, cb.dataset.email, cb.dataset.thread); return; }
                const ab = e.target.closest('[data-attach]'); if (ab) { openAttach(ab.dataset.attach, ab.dataset.email, ab.dataset.thread); return; }
                if (e.target.closest('a.deal-chip')) return;
                if (e.target.closest('#show-img')) { state.showImages = true; renderRead(); return; }
                if (e.target.closest('#retry-thread') && state.selected) { ensureThread(state.selected); return; }
                if (e.target.closest('#gm-expander')) { state.showMiddle = true; renderRead(); return; }
                const col = e.target.closest('.gm-collapse');
                if (col) { e.stopPropagation(); toggleItem(col.closest('.gm-item').dataset.mid, false); return; }
                const item = e.target.closest('.gm-item.collapsed');
                if (item) toggleItem(item.dataset.mid, true);
            });
            $('refresh-btn').addEventListener('click', refreshAll);
            wireComposer();
            wireAttach();

            // ── More filters popover ──
            const pop = $('filter-pop'), mb = $('more-filters-btn');
            mb.addEventListener('click', e => {
                e.stopPropagation();
                if (pop.hidden) { pop.hidden = false; mb.classList.add('open'); mb.setAttribute('aria-expanded', 'true'); }
                else closeFilters();
            });
            document.addEventListener('click', e => { if (!e.target.closest('.filter-wrap')) closeFilters(); });
            window.addEventListener('blur', closeFilters);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.attach) closeAttach(); else if (!$('cal-view').hidden) closeCal(); else closeFilters(); } });

            $('att-toggle').addEventListener('click', () => {
                state.filters.attach = !state.filters.attach;     // click again to remove it
                syncFilterInputs();
                render();
            });

            // date pills: type DD/MM/YYYY (slashes are added for you) or pick from the calendar icon
            ['from', 'to'].forEach(k => {
                const inp = $('f-' + k);
                inp.addEventListener('input', () => {
                    let v = inp.value.replace(/[^\d]/g, '').slice(0, 8);
                    if (v.length > 4) v = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
                    else if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
                    inp.value = v;
                    if (v === '') { setDateFilter(k, ''); return; }
                    const iso = parseDMY(v);
                    if (iso) setDateFilter(k, iso);
                });
                inp.addEventListener('blur', () => { inp.value = toDMY(state.filters[k]); });   // drop half-typed text
            });
            $('pop-main').addEventListener('click', e => {
                const b = e.target.closest('[data-cal]'); if (b) openCal(b.dataset.cal);
            });
            $('cal-view').addEventListener('click', e => {
                e.stopPropagation();                       // the calendar re-renders itself, so don't let the outside-click handler see it
                const day = e.target.closest('[data-d]'), nav = e.target.closest('[data-nav]');
                if (day) { setDateFilter(cal.target, `${cal.y}-${pad(cal.m + 1)}-${pad(+day.dataset.d)}`); closeCal(); return; }
                if (nav) {
                    cal.m += +nav.dataset.nav;
                    if (cal.m < 0) { cal.m = 11; cal.y--; } else if (cal.m > 11) { cal.m = 0; cal.y++; }
                    renderCalendar(); return;
                }
                if (e.target.closest('[data-today]')) { const t = istToday(); setDateFilter(cal.target, `${t.y}-${pad(t.m)}-${pad(t.d)}`); closeCal(); return; }
                if (e.target.closest('[data-cclear]')) { setDateFilter(cal.target, ''); closeCal(); return; }
                if (e.target.closest('[data-back]')) closeCal();
            });
            $('f-clear').addEventListener('click', () => clearFilter('all'));
            $('activebar').addEventListener('click', e => {
                const b = e.target.closest('[data-clear]'); if (b) clearFilter(b.dataset.clear);
            });

            if (!token || !scopeId) {
                $('sub').textContent = '';
                $('list').innerHTML = `<div class="empty err">${!token ? 'Missing auth token in the URL (?token=…).' : 'Missing contact id in the URL (?id=…).'}</div>`;
                return;
            }

            try {
                state.me = await loadMe();
            } catch (e) {
                $('sub').textContent = '';
                $('list').innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
                return;
            }

            try {
                await prepareScope();
                state.scopeReady = true;
            } catch (e) {
                console.error(e);
                $('sub').textContent = '';
                $('list').innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
                return;
            }

            renderSub();
            await reload();
        });

    </script>
</body>

</html>
