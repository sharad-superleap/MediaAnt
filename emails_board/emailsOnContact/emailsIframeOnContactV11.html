<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        window.onerror = function (m, s, l, c, e) { window.parent.postMessage({ type: 'dashboard-error', error: { message: m, source: s, line: l, stack: e?.stack } }, '*'); return false; };
        window.addEventListener('unhandledrejection', e => { window.parent.postMessage({ type: 'dashboard-error', error: { message: 'Unhandled Promise Rejection', reason: e.reason?.message || String(e.reason) } }, '*'); });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact emails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: #1f2937;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        button, input { font-family: inherit; }

        .wrap { padding: 16px; }

        .mail {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(16, 24, 40, .08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
            min-height: 460px;
        }

        /* ── top bar ── */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 20px;
            border-bottom: 1px solid #eef1f4;
        }

        .title { font-size: 17px; font-weight: 600; color: #111827; letter-spacing: -0.01em; }
        .title .sub { display: block; font-size: 12px; font-weight: 400; color: #6b7280; margin-top: 2px; }

        .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 1; justify-content: flex-end; }

        .search { position: relative; flex: 1; max-width: 340px; min-width: 140px; }

        .search input {
            width: 100%;
            height: 36px;
            padding: 0 12px 0 34px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
            font-size: 13px;
            outline: none;
            transition: border-color .15s, background .15s;
        }

        .search input:focus { border-color: #175259; background: #fff; }

        .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #9ca3af; }

        .icon-btn {
            width: 36px; height: 36px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid #e5e7eb; border-radius: 8px;
            background: #fff; color: #374151; cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }

        .icon-btn:hover { background: #f3f4f6; border-color: #175259; color: #175259; }
        .icon-btn.spinning svg { animation: spin .8s linear infinite; }

        /* ── More filters ── */
        .filter-wrap { position: relative; flex-shrink: 0; }

        .more-btn {
            height: 36px; display: inline-flex; align-items: center; gap: 8px;
            padding: 0 12px; border: 1px solid #e5e7eb; border-radius: 8px;
            background: #fff; color: #374151; font-size: 13px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
            transition: background .15s, border-color .15s, color .15s;
        }

        .more-btn:hover, .more-btn.open { border-color: #175259; color: #175259; background: #f5fafa; }

        .count-dot {
            min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
            background: #175259; color: #fff; font-size: 11px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
        }

        .count-dot[hidden] { display: none; }

        .pop {
            position: absolute; right: 0; top: calc(100% + 8px);
            width: 320px; max-width: calc(100vw - 48px);
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            box-shadow: 0 12px 32px rgba(16, 24, 40, .16);
            padding: 16px; z-index: 40;
        }

        .pop[hidden] { display: none; }
        .pop-sec + .pop-sec { margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f1f3; }
        .pop-h { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; }

        .sel-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            width: 100%; padding: 9px 12px;
            border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
            color: #374151; font-size: 13.5px; text-align: left; cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }

        .sel-row:hover { background: #f9fafb; }
        .sel-row .tick { display: none; flex-shrink: 0; color: #1d6fb8; }
        .sel-row.on { background: #e8f3fd; border-color: #bcdcf7; color: #14558f; font-weight: 500; }
        .sel-row.on:hover { background: #dff0fc; }
        .sel-row.on .tick { display: block; }

        .pills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pill-l { display: block; font-size: 11.5px; color: #9ca3af; margin-bottom: 4px; }
        .date-box { position: relative; }

        .pill {
            width: 100%; height: 36px; padding: 0 36px 0 14px;
            border: 1px solid #e5e7eb; border-radius: 999px;
            font-family: inherit; font-size: 13px; color: #111827; background: #fff; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .pill::placeholder { color: #9ca3af; }
        .pill:focus { border-color: #374151; box-shadow: 0 0 0 3px rgba(55, 65, 81, .10); }

        .cal-btn {
            position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #374151;
            padding: 5px; line-height: 0; border-radius: 50%;
        }

        .cal-btn:hover { background: #eef4f5; color: #175259; }

        /* custom calendar (same look as the meet scheduler) */
        .cal-title { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .cal-month { font-size: 15px; font-weight: 600; color: #111827; }

        .cal-nav {
            width: 32px; height: 32px; border: none; background: none; border-radius: 8px;
            cursor: pointer; color: #374151; display: inline-flex; align-items: center; justify-content: center;
        }

        .cal-nav:hover { background: #f3f4f6; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-dow { font-size: 12px; font-weight: 500; color: #9ca3af; text-align: center; padding: 6px 0; }

        .cal-day {
            height: 34px; border: 1px solid transparent; background: none; border-radius: 8px;
            font-size: 14px; color: #111827; cursor: pointer; font-variant-numeric: tabular-nums;
        }

        .cal-day:hover:not(.sel) { background: #eef4f5; }
        .cal-day.today { border-color: #175259; color: #175259; font-weight: 600; }
        .cal-day.sel { background: #175259; border-color: #175259; color: #fff; font-weight: 600; }

        .cal-foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f1f3; display: flex; justify-content: space-between; align-items: center; }
        .cal-link { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; color: #175259; padding: 4px 8px; border-radius: 6px; }
        .cal-link:hover { background: #eef4f5; }
        .cal-link.muted { color: #6b7280; font-weight: 500; }
        .pop-hint { font-size: 11.5px; color: #9ca3af; margin-top: 8px; line-height: 1.45; }
        .pop-foot { display: flex; justify-content: flex-end; margin-top: 14px; }

        .flink { border: none; background: none; color: #175259; font-weight: 600; font-size: 12.5px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
        .flink:hover { background: #eef4f5; }

        /* active filter chips */
        .activebar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            padding: 8px 20px; border-bottom: 1px solid #eef1f4; background: #fafbfb;
        }

        .activebar[hidden] { display: none; }

        .fchip {
            display: inline-flex; align-items: center; gap: 4px;
            background: #e8f1f2; color: #0f3d42; border-radius: 999px;
            padding: 3px 6px 3px 12px; font-size: 12.5px;
        }

        .fchip button { border: none; background: none; cursor: pointer; color: #175259; font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 50%; }
        .fchip button:hover { background: #d6e7e9; }

        /* ── tabs ── */
        .tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid #eef1f4; }

        .tab {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 14px; border: none; background: none;
            font-size: 13.5px; font-weight: 500; color: #6b7280; cursor: pointer;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
        }

        .tab:hover { color: #111827; }
        .tab.active { color: #175259; border-bottom-color: #175259; font-weight: 600; }

        .badge {
            min-width: 22px; padding: 1px 7px; border-radius: 999px;
            background: #f3f4f6; color: #6b7280;
            font-size: 11.5px; font-weight: 600; text-align: center;
        }

        .tab.active .badge { background: #e8f1f2; color: #175259; }

        /* ── body: list + reading pane ── */
        .body { flex: 1; display: grid; grid-template-columns: minmax(300px, 38%) 1fr; min-height: 0; }

        .list { overflow-y: auto; border-right: 1px solid #eef1f4; }

        .row {
            display: flex; gap: 12px; padding: 12px 16px;
            border-bottom: 1px solid #f3f4f6; cursor: pointer; transition: background .12s;
        }

        .row:hover { background: #f9fafb; }
        .row.sel { background: #eef6f7; box-shadow: inset 3px 0 0 #175259; }

        .avatar {
            width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%;
            background: #175259; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px; text-transform: uppercase;
        }

        .row-main { flex: 1; min-width: 0; }
        .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
        .row-who { font-weight: 600; color: #111827; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; color: #9ca3af; }
        .row-date { font-size: 11.5px; color: #9ca3af; white-space: nowrap; }
        .row-subj { font-size: 13px; color: #374151; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row-snip { font-size: 12px; color: #6b7280; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        mark { background: #fef08a; color: inherit; border-radius: 2px; padding: 0 1px; }

        .more { padding: 14px; text-align: center; }
        .more-note { font-size: 12px; color: #9ca3af; margin-bottom: 8px; }

        .btn {
            height: 34px; padding: 0 18px;
            border: 1px solid #d1d5db; border-radius: 8px;
            background: #fff; color: #374151;
            font-size: 13px; font-weight: 500; cursor: pointer;
        }

        .btn:hover:not(:disabled) { background: #f3f4f6; }
        .btn:disabled { color: #9ca3af; cursor: not-allowed; }

        /* ── reading pane ── */
        .read { overflow-y: auto; padding: 24px 28px; }

        .read-subj {
            font-size: 20px; font-weight: 600; color: #111827;
            line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 18px; word-break: break-word;
        }

        .meta {
            display: grid; grid-template-columns: 70px 1fr; gap: 10px 12px;
            font-size: 13px; padding: 14px 16px;
            background: #f9fafb; border: 1px solid #eef1f4; border-radius: 10px;
        }

        .meta .k { color: #9ca3af; font-weight: 500; }
        .meta .v { color: #111827; display: flex; flex-wrap: wrap; gap: 6px; word-break: break-all; }

        .chip { background: #e8f1f2; color: #0f3d42; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
        .chip.none { background: none; color: #9ca3af; padding: 0; }

        .dir-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
        .dir-tag.sent { background: #dbeafe; color: #1d4ed8; }
        .dir-tag.received { background: #dcfce7; color: #166534; }

        /* attachments */
        .atts-label { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; }
        .atts { display: flex; flex-wrap: wrap; gap: 8px; }

        .att {
            display: inline-flex; align-items: center; gap: 8px;
            max-width: 100%; padding: 8px 12px;
            border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
            color: #111827; text-decoration: none; font-size: 13px;
            transition: border-color .15s, background .15s;
        }

        .att:hover { border-color: #175259; background: #f5fafa; }
        .att svg { flex-shrink: 0; color: #175259; }
        .att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
        .att .ext { flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: #6b7280; background: #f3f4f6; border-radius: 4px; padding: 1px 6px; }

        /* message body */
        .notice {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin-top: 18px; padding: 8px 12px;
            background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px;
            color: #92400e; font-size: 12.5px;
        }

        .notice button { border: none; background: none; color: #175259; font-weight: 600; cursor: pointer; font-size: 12.5px; }

        .body-frame { display: block; width: 100%; height: 80px; border: 0; margin-top: 18px; background: #fff; }
        .body-sep { height: 1px; background: #eef1f4; margin-top: 18px; }

        /* states */
        .empty { padding: 48px 20px; text-align: center; color: #9ca3af; font-size: 13px; }
        .empty.err { color: #b91c1c; }
        .read > .empty { padding-top: 110px; }

        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #175259; border-radius: 50%;
            width: 28px; height: 28px; animation: spin .8s linear infinite; margin: 40px auto;
        }

        .loader.small { width: 22px; height: 22px; margin: 28px auto; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 760px) {
            .body { grid-template-columns: 1fr; }
            .list { border-right: none; max-height: 40vh; border-bottom: 1px solid #eef1f4; }
            .top { flex-wrap: wrap; }
            .tools { width: 100%; }
            .search { max-width: none; }
            .read { padding: 18px; }
            .activebar { padding: 8px 14px; }
        }
    
        /* ── conversation list ── */
        .day-head {
            position: sticky; top: 0; z-index: 2;
            padding: 8px 16px; background: #f9fafa; border-bottom: 1px solid #eef1f4;
            font-size: 12px; font-weight: 600; color: #6b7280;
        }

        .row-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }

        .reply-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600; color: #175259;
            background: #e8f1f2; border-radius: 999px; padding: 1px 9px;
        }

        .row-tags .dir-tag { padding: 1px 9px; font-size: 11px; }

        /* ── thread (Gmail-style) ── */
        .read-sub { margin: -10px 0 14px; font-size: 12.5px; color: #6b7280; }
        .thread { border: 1px solid #eef1f4; border-radius: 10px; overflow: hidden; background: #fff; }

        .gm-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eef1f4; }
        .gm-item:last-child { border-bottom: none; }
        .gm-item.collapsed { cursor: pointer; align-items: center; transition: background .12s; }
        .gm-item.collapsed:hover { background: #f9fafb; }

        .gm-avatar {
            width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; text-transform: uppercase;
        }

        .gm-main { flex: 1; min-width: 0; }
        .gm-name { font-weight: 600; color: #111827; font-size: 13.5px; word-break: break-all; }
        .gm-snip { font-size: 12.5px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .gm-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; color: #9ca3af; font-size: 12px; white-space: nowrap; }
        .gm-content { flex: 1; min-width: 0; }
        .gm-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .gm-from { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
        .gm-addr { font-size: 12px; color: #6b7280; word-break: break-all; }

        .gm-collapse { border: none; background: none; cursor: pointer; color: #9ca3af; padding: 3px; border-radius: 6px; line-height: 0; }
        .gm-collapse:hover { background: #f3f4f6; color: #374151; }

        .gm-rcpt { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 4px; font-size: 12.5px; color: #4b5563; word-break: break-all; }
        .gm-rcpt b { font-weight: 500; color: #9ca3af; margin-right: 4px; }
        .gm-content .atts { margin-top: 10px; }
        .gm-body { margin-top: 10px; }
        .gm-body .body-frame { margin-top: 0; }

        .gm-expander {
            display: flex; align-items: center; gap: 10px; padding: 8px 16px;
            border-bottom: 1px solid #eef1f4; background: #fafbfb; cursor: pointer;
            color: #6b7280; font-size: 12.5px; transition: background .12s;
        }

        .gm-expander:hover { background: #f3f4f6; }

        .gm-count {
            min-width: 30px; height: 30px; padding: 0 6px; border-radius: 50%;
            border: 1px solid #d1d5db; background: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; color: #374151;
        }


        /* ── deal link / convert-to-deal ── */
        .deal-chip {
            display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
            padding: 1px 9px; border-radius: 999px; text-decoration: none;
            font-size: 11.5px; font-weight: 600; line-height: 1.6; white-space: nowrap;
            transition: filter .12s;
        }

        .deal-chip:hover { filter: brightness(.95); text-decoration: underline; }
        .deal-chip span { overflow: hidden; text-overflow: ellipsis; }
        .deal-chip svg { flex-shrink: 0; }
        .row-deal, .gm-deal { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
        .gm-deal { margin-top: 8px; }

        .convert-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 1px 11px; border-radius: 999px; cursor: pointer;
            border: 1px solid #175259; background: #fff; color: #175259;
            font-size: 11.5px; font-weight: 600; line-height: 1.6; white-space: nowrap;
            transition: background .15s, color .15s, border-color .15s;
        }

        .convert-btn:hover:not(:disabled) { background: #e8f1f2; }
        .convert-btn:disabled { cursor: default; }
        .convert-btn.sending { border-color: #d1d5db; color: #6b7280; }
        .convert-btn.sent, .convert-btn.created { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
        .convert-btn.existing { border-color: #bfdbfe; background: #eff6ff; color: #1d4ed8; }
        .convert-btn.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }

        .mini-spin {
            width: 10px; height: 10px; border: 2px solid #d1d5db; border-top-color: #175259;
            border-radius: 50%; animation: spin .8s linear infinite;
        }

        /* ── attach to deal: button + modal ── */
        .attach-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 1px 11px; border-radius: 999px; cursor: pointer;
            border: 1px solid #d1d5db; background: #fff; color: #374151;
            font-size: 11.5px; font-weight: 600; line-height: 1.6; white-space: nowrap;
            transition: background .15s, color .15s, border-color .15s;
        }

        .attach-btn:hover { background: #f5fafa; border-color: #175259; color: #175259; }

        .modal-back {
            position: fixed; inset: 0; z-index: 90; padding: 16px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(17, 24, 39, .45);
        }

        .modal-back[hidden] { display: none; }

        .modal {
            width: 100%; max-width: 440px; max-height: min(560px, calc(100vh - 32px));
            display: flex; flex-direction: column; overflow: hidden;
            background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(16, 24, 40, .28);
        }

        .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid #eef1f4; }
        .modal-title { font-size: 16px; font-weight: 600; color: #111827; letter-spacing: -0.01em; }
        .modal-sub { margin-top: 3px; max-width: 330px; font-size: 12.5px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal-x { border: none; background: none; cursor: pointer; font-size: 24px; line-height: 1; color: #9ca3af; padding: 0 7px 3px; border-radius: 8px; }
        .modal-x:hover { background: #f3f4f6; color: #374151; }
        .modal-body { padding: 12px 18px; overflow-y: auto; min-height: 96px; }
        .modal-body .empty { padding: 28px 12px; }
        .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid #eef1f4; }
        .am-err { flex: 1; font-size: 12.5px; color: #b91c1c; }

        .am-list { display: flex; flex-direction: column; gap: 8px; }

        .am-item {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px;
            border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; color: #111827;
            font-size: 13.5px; text-align: left; cursor: pointer;
            transition: background .12s, border-color .12s;

        .am-item:hover { background: #f9fafb; }
        .am-item.on { border-color: #175259; background: #f1f8f8; }
        .am-radio { position: relative; width: 16px; height: 16px; flex-shrink: 0; border: 2px solid #d1d5db; border-radius: 50%; }
        .am-item.on .am-radio { border-color: #175259; }
        .am-item.on .am-radio:after { content: ''; position: absolute; inset: 2px; border-radius: 50%; background: #175259; }
        .am-name { overflow: hidden; text-overflow: ellipsis; }

        /* ── reply all ── */
        .gm-iconbtn { border: none; background: none; cursor: pointer; color: #9ca3af; padding: 3px; border-radius: 6px; line-height: 0; }
        .gm-iconbtn:hover { background: #f3f4f6; color: #175259; }
        .gm-actions { margin-top: 12px; }

        .reply-btn {
            display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
            border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #374151;
            font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
        }

        .reply-btn:hover { background: #f5fafa; border-color: #175259; color: #175259; }

        .gm-compose { padding: 12px 16px 14px; border-bottom: 1px solid #eef1f4; background: #fafbfb; }
        .cp-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .cp-title { font-size: 12px; font-weight: 700; color: #175259; text-transform: uppercase; letter-spacing: .4px; }
        .cp-close { border: none; background: none; cursor: pointer; font-size: 20px; line-height: 1; color: #9ca3af; padding: 0 6px; border-radius: 6px; }
        .cp-close:hover { background: #f3f4f6; color: #374151; }

        .cp-row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; border-bottom: 1px solid #eef1f4; }
        .cp-l { width: 52px; flex-shrink: 0; color: #9ca3af; font-size: 12.5px; padding-top: 6px; }
        .cp-from { font-size: 13px; color: #374151; padding-top: 5px; word-break: break-all; }
        .cp-chips { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
        .cp-chips.invalid .cp-input { color: #b91c1c; }

        .cp-chip {
            display: inline-flex; align-items: center; gap: 4px; background: #e8f1f2; color: #0f3d42;
            border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12.5px; word-break: break-all;
        }

        .cp-x { border: none; background: none; cursor: pointer; color: #175259; font-size: 15px; line-height: 1; padding: 0 4px; border-radius: 50%; }
        .cp-x:hover { background: #d6e7e9; }
        .cp-input { flex: 1; min-width: 150px; height: 28px; border: none; outline: none; background: transparent; font-size: 13px; }
        .cp-subject { flex: 1; height: 30px; border: none; outline: none; background: transparent; font-size: 13.5px; font-weight: 500; color: #111827; }
        .cp-link { border: none; background: none; cursor: pointer; color: #175259; font-size: 12.5px; font-weight: 600; padding: 5px 4px; border-radius: 6px; }
        .cp-link:hover { background: #eef4f5; }

        .cp-editor {
            min-height: 120px; max-height: 340px; overflow-y: auto; padding: 10px 2px; outline: none;
            font-size: 14px; line-height: 1.55; color: #1f2937; word-break: break-word;
        }

        .cp-editor:empty:before { content: attr(data-placeholder); color: #9ca3af; }
        .cp-editor img { max-width: 100%; height: auto; border-radius: 4px; }
        .cp-quote { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b7280; margin: 2px 0 8px; cursor: pointer; }
        .cp-quote input { accent-color: #175259; }
        .cp-files { display: flex; flex-wrap: wrap; gap: 6px; }
        .cp-files:not(:empty) { margin-bottom: 8px; }

        .cp-file {
            display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
            padding: 4px 4px 4px 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; font-size: 12.5px; color: #111827;
        }

        .cp-file svg { color: #175259; flex-shrink: 0; }
        .cp-file.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
        .cp-fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
        .cp-fs { color: #9ca3af; font-size: 11.5px; }
        .cp-file-x { border: none; background: none; cursor: pointer; color: #6b7280; font-size: 15px; line-height: 1; padding: 0 5px; border-radius: 50%; }
        .cp-file-x:hover { background: #f3f4f6; }

        .cp-spin {
            width: 11px; height: 11px; flex-shrink: 0; border: 2px solid #d1d5db; border-top-color: #175259;
            border-radius: 50%; animation: spin .8s linear infinite;
        }

        .cp-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .cp-tools { display: flex; align-items: center; gap: 2px; }

        .cp-fmt, .cp-tool {
            min-width: 30px; height: 30px; border: none; background: none; border-radius: 6px; cursor: pointer;
            color: #4b5563; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px;
        }

        .cp-fmt:hover, .cp-tool:hover { background: #eef1f4; color: #175259; }
        .cp-sep { width: 1px; height: 18px; background: #e5e7eb; margin: 0 6px; }
        .cp-err { flex: 1; min-width: 120px; font-size: 12.5px; color: #b91c1c; }
        .cp-actions { display: flex; align-items: center; gap: 8px; }

        .cp-send {
            height: 34px; padding: 0 22px; border: none; border-radius: 8px; background: #175259; color: #fff;
            font-size: 13px; font-weight: 600; cursor: pointer;
        }

        .cp-send:hover:not(:disabled) { background: #0f3d42; }
        .cp-send:disabled { background: #9ca3a5; cursor: not-allowed; }

        .toast {
            position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
            padding: 10px 18px; border-radius: 10px; background: #111827; color: #fff; font-size: 13px; z-index: 100;
            transition: opacity .2s, transform .2s;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.err { background: #b91c1c; }

        .cp-fromin { flex: 1; min-width: 0; height: 30px; border: none; outline: none; background: transparent; font-size: 13px; color: #374151; }
        .cp-hint { font-size: 11.5px; color: #9ca3af; margin: 2px 0 4px 62px; line-height: 1.4; }
        .cp-topright { display: flex; align-items: center; gap: 6px; }

        .cp-editor ul, .cp-editor ol { margin: 4px 0 4px 4px; padding-left: 22px; }
        .cp-editor ul { list-style: disc; }
        .cp-editor ol { list-style: decimal; }
        .cp-editor li { margin: 2px 0; }
        .cp-fromin[readonly] { color: #6b7280; cursor: default; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="mail">
            <div class="top">
                <div class="title">Contact emails<span class="sub" id="sub">Loading…</span></div>
                <div class="tools">
                    <div class="search">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M21 21l-4.3-4.3" />
                        </svg>
                        <input id="search" type="text" placeholder="Search mails, content, attachments" autocomplete="off">
                    </div>

                    <div class="filter-wrap">
                        <button class="more-btn" id="more-filters-btn" type="button" aria-haspopup="true" aria-expanded="false">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 6h16M7 12h10M10 18h4" />
                            </svg>
                            More filters
                            <span class="count-dot" id="filter-count" hidden>0</span>
                        </button>
                        <div class="pop" id="filter-pop" hidden>
                            <div id="pop-main">
                                <div class="pop-sec">
                                    <div class="pop-h">Attachment</div>
                                    <button class="sel-row" id="att-toggle" type="button" aria-pressed="false">
                                        <span>Has attachment</span>
                                        <svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M5 12.5l4.5 4.5L19 7.5" />
                                        </svg>
                                    </button>
                                </div>
                                <div class="pop-sec">
                                    <div class="pop-h">Date</div>
                                    <div class="pills">
                                        <div>
                                            <label class="pill-l" for="f-from">Start date</label>
                                            <div class="date-box">
                                                <input class="pill" id="f-from" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off">
                                                <button class="cal-btn" type="button" data-cal="from" aria-label="Pick start date">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                                        <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
                                                        <path d="M3.5 10h17M8 3v4M16 3v4M12 13.5v4" />
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>
                                        <div>
                                            <label class="pill-l" for="f-to">End date</label>
                                            <div class="date-box">
                                                <input class="pill" id="f-to" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off">
                                                <button class="cal-btn" type="button" data-cal="to" aria-label="Pick end date">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                                        <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
                                                        <path d="M3.5 10h17M8 3v4M16 3v4M12 13.5v4" />
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="pop-hint">Filters on the mail date (when it was received or sent). Enter only one date to see mails from that day.</div>
                                </div>
                                <div class="pop-foot"><button class="flink" id="f-clear" type="button">Clear all</button></div>
                            </div>
                            <div id="cal-view" hidden></div>
                        </div>
                    </div>

                    <button class="icon-btn" id="refresh-btn" type="button" title="Refresh" aria-label="Refresh">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
                            <path d="M21 3v5h-5" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="activebar" id="activebar" hidden></div>

            <div class="body">
                <div class="list" id="list">
                    <div class="loader"></div>
                </div>
                <div class="read" id="read">
                    <div class="empty">Select a conversation to read it</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-back" id="attach-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="am-title">
            <div class="modal-head">
                <div>
                    <div class="modal-title" id="am-title">Attach to deal</div>
                    <div class="modal-sub" id="am-sub"></div>
                </div>
                <button class="modal-x" id="am-close" type="button" title="Close" aria-label="Close">×</button>
            </div>
            <div class="modal-body" id="am-body"></div>
            <div class="modal-foot">
                <div class="am-err" id="am-err"></div>
                <button class="btn" id="am-cancel" type="button">Cancel</button>
                <button class="cp-send" id="am-attach" type="button" disabled>Attach</button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // CONFIG
        // ═══════════════════════════════════════════════════════════════
        const BASE_URL = 'https://app.superleap.com';
        const API_URL = BASE_URL + '/api/v1/reports/execute';
        const ME_URL = BASE_URL + '/api/v1/org/user/me';

        const CLIENT_ID = 'superleapweb';
        const CLIENT_SECRET = 'UEAlm1PWab8VXB5b';   // same as the other dashboards — confirm prod value

        const EMAIL_OBJECT_SLUG = 'email';
        const F = {
            thread: 'thread_id',        // mails of one conversation share this
            direction: 'direction',     // 'sent' | 'received'
            from: 'from_email',
            to: 'recipient_email',
            cc: 'cc',
            bcc: 'bcc',
            received: 'received_at',    // main mail time (falls back to sent_at when empty)
            sent: 'sent_at',
            subject: 'subject',
            content: 'content',         // plain text: fetched in the list so it can be searched
            html: 'html_content',       // heavy: fetched only when a conversation is opened
            attachments: 'attachments', // list of file URLs
            created: 'created_at',      // record creation time: the date of mails that have neither received_at nor sent_at (e.g. sent from the platform)
            deals: 'email_deals',       // the deal(s) a mail is linked to (blank = no deal yet)
        };

        // Scope: every mail that has the contact's address in From / To / Cc / Bcc (no deal lookup)
        const CONTACT_SLUG_CANDIDATES = ['contacts'];   // ⚠ first object slug that answers is used
        const CONTACT_EMAIL_FIELDS = ['email', 'alternate_email']; // addresses of the contact to look for in the mails
        const SCOPE_TO_CURRENT_USER = false;      // true = also require the logged-in user to be in the mail
        const SCOPE_LABEL = 'contact';

        // Deal shown on each mail (name from the deals object, linking to the deal record) or a "Convert to deal" button when blank
        const DEAL_OBJECT_SLUG = 'deals';
        const DEAL_LABEL_FIELDS = ['name', 'campaign_name'];   // first non-empty one is the deal name (then the id as a last resort)
        const DEAL_URL = id => `https://app.superleap.com/deals/records/${encodeURIComponent(id)}`;
        const CONVERT_WEBHOOK = 'https://v1hooks.superleap.com/5aZNph/5aZNph_Sj3En4ggtaKcyoVsaeGj/sync';   // one webhook for both actions below
        const ACTION_CONVERT = 'convert_to_deal';
        const ACTION_ATTACH = 'attach_deal';
        const DEAL_CONTACT_FIELD = 'associated_contact';   // field on the deal that points to its contact (the deals listed in "Attach to deal")

        const PAGE_SIZE = 50;           // mails per page (they are grouped into conversations)
        const IST_MS = 5.5 * 60 * 60 * 1000;

        // ── Reply all ──
        const SEND_URL = BASE_URL + '/api/v1/org/communication/records/email';
        const UPLOAD_URL = BASE_URL + '/api/v1/org/file/upload';
        const PLATFORM_ID = '';                  // ⚠ sent as the `platform-id` header when your org needs one (the Pagarbook curl had one)
        const REPLY_FROM = '';                   // '' = always send from the logged-in user's email; set an address to force another one
        const ATTACHMENT_PAYLOAD = f => ({ name: f.name, type: f.type, url: f.url });   // attachments[] entry, same shape as the working Superleap request

        // To / Cc / Bcc entries: the API rejected plain strings in `cc` ("cannot unmarshal string into … email_client.SendTo"),
        // so every address is sent as an object. ⚠ Shapes are tried in order, the first one the API accepts is remembered.
        const RECIPIENT_SHAPES = [a => ({ to: a }), a => ({ email: a })];

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || params.get('authToken');
const scopeId = params.get('id') || params.get('contactId') || params.get('contact_id');

        // ═══════════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════════
        const state = {
            me: null,
            scopeReady: false,
            filters: { search: '', attach: false, from: '', to: '' },   // from/to = 'YYYY-MM-DD'
            groups: [],               // conversations, newest first
            groupMap: new Map(),      // key -> conversation
            threadCounts: {},         // thread_id -> number of mails in that thread
            offset: 0, done: false, loading: false, loaded: false, error: '', gen: 0,
            selected: null,           // conversation key
            threads: {},              // key -> { status: 'loading' | 'ok' | 'error', mails, error }
            expanded: new Set(),      // ids of the mails shown open in the thread
            showMiddle: false,        // long threads hide the middle mails until clicked
            showImages: false,        // remote images in mail bodies stay blocked until the user allows them
            dealNames: {},            // deal id -> deal name
            dealPending: new Set(),   // deal ids being looked up
            dealVer: 0,               // bumps when deal names/links change so the reading pane redraws
            convert: {},              // 'Convert to deal' request per button (conversation row key / mail id): { status: 'sending' | 'sent' | 'error', error }
            attach: null,             // the open "Attach to deal" modal: { key, emailId, threadId, subject, status, deals, selected, sending, sendError, error }
        };

        const $ = id => document.getElementById(id);

        // ═══════════════════════════════════════════════════════════════
        // API HELPERS
        // ═══════════════════════════════════════════════════════════════
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        async function safe(fn, retries = 3) {
            let lastErr;
            for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) { lastErr = e; if (i < retries - 1) await sleep(600 * (i + 1)); }
            }
            throw lastErr;
        }
        async function query(q, slug, retries = 3) {
            return safe(async () => {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ query: q, slug })
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
                const j = await r.json();
                if (!j.success) throw new Error(j.data?.message || 'API error');
                return j.data.records || [];
            }, retries);
        }
        const sqlStr = v => `'${String(v).replace(/'/g, "''")}'`;

        async function loadMe() {
            const r = await fetch(ME_URL, {
                headers: { 'Authorization': `Bearer ${token}`, 'client-id': CLIENT_ID, 'client-secret': CLIENT_SECRET }
            });
            if (!r.ok) throw new Error(`Could not load current user (HTTP ${r.status})`);
            const d = (await r.json())?.data || {};
            if (!d.user_id || !d.email) throw new Error('Could not identify the current user');
            return { id: d.user_id, email: String(d.email).trim().toLowerCase(), name: d.name || '' };
        }

        // ═══════════════════════════════════════════════════════════════
        // EMAIL ADDRESS HELPERS
        // cc/bcc/recipient may be an array, "a@x.com, b@x.com", "Name <a@x.com>", "{}" or "{a@x.com,b@x.com}"
        // ═══════════════════════════════════════════════════════════════
        const extractEmails = v => {
            const raw = Array.isArray(v) ? v.join(',') : String(v ?? '');
            return raw.match(/[^\s<>,;"'{}]+@[^\s<>,;"'{}]+/g) || [];
        };
        const asList = v => extractEmails(v).map(s => s.toLowerCase());

        // email_deals may come back as an id, a list of ids, "{id1,id2}", an object, or blank ("", "{}", "[]"): reduce it to plain ids
        const idList = v => {
            if (v == null || v === '') return [];
            if (Array.isArray(v)) return v.flatMap(idList);
            if (typeof v === 'object') return idList(v.id ?? v.value ?? '');
            const t = String(v).trim();
            if (/^[\[{]/.test(t)) {
                try { return idList(JSON.parse(t)); } catch (e) { }
                return t.replace(/^[\[{]|[\]}]$/g, '').split(',').map(x => x.trim().replace(/^"|"$/g, '')).filter(Boolean);
            }
            return t ? [t] : [];
        };

        // from_email / recipient_email / cc / bcc contain this address (works on text and list fields)
        const emailMatch = (col, email) => `${col}::text ILIKE ${sqlStr('%' + email.replace(/[%_]/g, '') + '%')}`;
        function addrMatch(addrs) {
            const conds = [];
            addrs.forEach(a => [F.from, F.to, F.cc, F.bcc].forEach(col => conds.push(emailMatch(col, a))));
            return `(${conds.join(' OR ')})`;
        }
        // exact-address check on a loaded mail (guards against substring look-alikes such as aa@x.com vs a@x.com)
        function mentions(r, addrs) {
            const set = new Set([...asList(r.from_email), ...asList(r.recipient_email), ...asList(r.cc), ...asList(r.bcc)]);
            return addrs.some(a => set.has(a));
        }

        // ═══════════════════════════════════════════════════════════════
        // SCOPE  (which mails belong on this page)
        // ═══════════════════════════════════════════════════════════════
        let contactAddrs = [];
        let contactSlug = CONTACT_SLUG_CANDIDATES[0];     // the object slug that answered (used as the record context when replying)

        // read the contact's own email addresses (email + alternate_email)
        async function prepareScope() {
            const cols = CONTACT_EMAIL_FIELDS.map((f, i) => `${f} as addr_${i}`).join(', ');
            let row = null, lastErr = null;
            for (const slug of CONTACT_SLUG_CANDIDATES) {
                try {
                    const rows = await query(`SELECT id, ${cols} FROM ${slug} WHERE id = ${sqlStr(scopeId)} LIMIT 1 OFFSET 0`, slug, 1);
                    if (!rows.length) throw new Error('Contact not found');
                    row = rows[0];
                    contactSlug = slug;
                    break;
                } catch (e) {
                    lastErr = e;
                    if (e.message === 'Contact not found') break;      // the slug is right, the record is not
                }
            }
            if (!row) throw new Error(lastErr ? lastErr.message : 'Contact not found');
            contactAddrs = [...new Set(CONTACT_EMAIL_FIELDS.flatMap((f, i) => asList(row['addr_' + i])))];
            if (!contactAddrs.length) throw new Error('This contact has no email address.');
        }
        function scopeWhere() {
            const parts = [addrMatch(contactAddrs)];
            if (SCOPE_TO_CURRENT_USER) parts.push(addrMatch([state.me.email]));
            return parts.join(' AND ');
        }
        const inScope = r => mentions(r, contactAddrs) && (!SCOPE_TO_CURRENT_USER || mentions(r, [state.me.email]));
        const scopeSub = () => `Showing mails with ${contactAddrs.join(', ')}`;

        // ═══════════════════════════════════════════════════════════════
        // DATE FILTER  (IST day boundaries; one date = that single day)
        // ═══════════════════════════════════════════════════════════════
        function dateBounds() {
            let a = state.filters.from, b = state.filters.to;
            if (!a && !b) return null;
            if (!a) a = b;
            if (!b) b = a;
            if (a > b) [a, b] = [b, a];                       // 'YYYY-MM-DD' strings sort chronologically
            const dayStart = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) - IST_MS; };
            // [start of the first day, start of the day after the last day)
            return { a, b, start: dayStart(a), end: dayStart(b) + 24 * 60 * 60 * 1000 };
        }

        function whereClause() {
            const parts = [scopeWhere()];
            const db = dateBounds();
            if (db) {
                const R = F.received, S = F.sent, C = F.created;
                parts.push(`((${R} >= ${db.start} AND ${R} < ${db.end}) OR (${R} IS NULL AND ${S} >= ${db.start} AND ${S} < ${db.end}) OR (${R} IS NULL AND ${S} IS NULL AND ${C} >= ${db.start} AND ${C} < ${db.end}))`);
            }
            return parts.join(' AND ');
        }

        // list query: light columns + content (search) + attachments (search / filter); newest mail first
        async function fetchPage() {
            const q = `SELECT id, ${F.thread} as thread_id, ${F.direction} as direction, ${F.from} as from_email, ${F.to} as recipient_email, ` +
                `${F.cc} as cc, ${F.bcc} as bcc, ${F.received} as received_at, ${F.sent} as sent_at, ${F.created} as created_at, ${F.subject} as subject, ` +
                `${F.content} as content, ${F.attachments} as attachments, ${F.deals} as email_deals ` +
                `FROM ${EMAIL_OBJECT_SLUG} WHERE ${whereClause()} ` +
                `ORDER BY coalesce(${F.received}, ${F.sent}, ${F.created}) DESC NULLS LAST, id DESC LIMIT ${PAGE_SIZE} OFFSET ${state.offset}`;
            return query(q, EMAIL_OBJECT_SLUG);
        }

        // every mail of one conversation (any direction, any sender), oldest first, with the heavy html column
        async function fetchThread(g) {
            const where = g.threadId ? `${F.thread} = ${sqlStr(g.threadId)}` : `id = ${sqlStr(g.latest.id)}`;
            const q = `SELECT id, ${F.thread} as thread_id, ${F.subject} as subject, ${F.from} as from_email, ${F.to} as recipient_email, ` +
                `${F.cc} as cc, ${F.bcc} as bcc, ${F.received} as received_at, ${F.sent} as sent_at, ${F.created} as created_at, ` +
                `${F.html} as html_content, ${F.content} as content, ${F.direction} as direction, ${F.attachments} as attachments, ${F.deals} as email_deals ` +
                `FROM ${EMAIL_OBJECT_SLUG} WHERE ${where} ORDER BY coalesce(${F.received}, ${F.sent}, ${F.created}) ASC LIMIT 200 OFFSET 0`;
            const rows = await query(q, EMAIL_OBJECT_SLUG);
            rows.forEach(m => { m._dealIds = idList(m.email_deals); });
            return rows.sort((a, b) => mailMs(a) - mailMs(b));
        }

        // ═══════════════════════════════════════════════════════════════
        // SEARCH INDEX  (built once per mail when it is loaded)
        // ═══════════════════════════════════════════════════════════════
        // lowercase, and treat _ - . as spaces so "Media Ant" finds Media_Ant and "superleap.com" finds superleap com
        const norm = s => String(s ?? '').toLowerCase().replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();

        const looksHtml = s => /<(html|body|div|p|br|span|table|tr|td|a|ul|ol|li|img|h[1-6]|b|i|u|strong|em|font|style|blockquote|section|center)\b[^>]*>/i.test(s);

        // content may be plain text or HTML: reduce it to readable text
        function contentText(c) {
            let s = String(c ?? '');
            if (!s.trim()) return '';
            if (looksHtml(s)) {
                s = s.replace(/<(style|script|head)[\s\S]*?<\/\1>/gi, ' ')
                    .replace(/<br\s*\/?>|<\/(p|div|li|tr|h[1-6])>/gi, ' ')
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
            }
            return s.replace(/\s+/g, ' ').trim();
        }

        // attachments can be an array of URLs, a JSON string, or null
        function normAtt(a) {
            if (!a) return [];
            if (Array.isArray(a)) return a.filter(Boolean).map(String);
            if (typeof a === 'string') {
                try { const j = JSON.parse(a); if (Array.isArray(j)) return j.filter(Boolean).map(String); } catch (e) { }
                return a.split(',').map(s => s.trim()).filter(u => /^https?:\/\//i.test(u));
            }
            return [];
        }
        // file name = last path segment of the URL (works for any org id / folder layout)
        function rawName(url) {
            try { return decodeURIComponent(new URL(url).pathname.split('/').pop() || ''); } catch (e) { return ''; }
        }
        function attName(url) {
            // strip the "-<14 digit timestamp>-<8 hex>" suffix added on upload
            return rawName(url).replace(/-\d{14}-[0-9a-f]{8}(?=\.[^.]+$|$)/i, '') || 'Attachment';
        }
        const attExt = n => (n.includes('.') ? n.split('.').pop().slice(0, 5).toUpperCase() : 'FILE');

        function toDate(v) {
            if (v == null || v === '') return null;
            const d = /^\d+$/.test(String(v)) ? new Date(Number(v)) : new Date(v);
            return isNaN(d) ? null : d;
        }
        const mailT = m => m.received_at ?? m.sent_at ?? m.created_at;
        const mailMs = m => { const d = toDate(mailT(m)); return d ? d.getTime() : 0; };

        function indexMail(m) {
            m._atts = normAtt(m.attachments);
            m._attNames = m._atts.map(attName);
            m._text = contentText(m.content);
            m._dealIds = idList(m.email_deals);
            m._nMeta = norm([m.subject, m.from_email, ...extractEmails(m.recipient_email), ...extractEmails(m.cc), ...extractEmails(m.bcc)].join(' '));
            m._nAtt = norm([...m._attNames, ...m._atts.map(rawName)].join(' '));
            m._hay = `${m._nMeta} ${m._nAtt} ${norm(m._text)}`;
            return m;
        }

        // ═══════════════════════════════════════════════════════════════
        // CONVERSATIONS  (mails grouped by thread_id)
        // ═══════════════════════════════════════════════════════════════
        const groupKey = m => m.thread_id ? 'T:' + m.thread_id : 'M:' + m.id;

        function refreshGroup(g) {
            g.mails.sort((a, b) => mailMs(b) - mailMs(a));    // newest first
            g.latest = g.mails[0];
            g.time = mailMs(g.latest);
            g.atts = g.mails.reduce((n, m) => n + m._atts.length, 0);
            g.hay = g.mails.map(m => m._hay).join(' ');
            g.dealIds = [...new Set(g.mails.flatMap(m => m._dealIds))];
            g.count = Math.max(g.mails.length, g.count || 0);
        }

        function addMails(rows) {
            const touched = new Set();
            rows.forEach(m => {
                indexMail(m);
                const key = groupKey(m);
                let g = state.groupMap.get(key);
                if (!g) {
                    g = { key, threadId: m.thread_id || '', mails: [], count: 0 };
                    state.groupMap.set(key, g);
                    state.groups.push(g);
                }
                g.mails.push(m);
                touched.add(g);
            });
            touched.forEach(refreshGroup);
        }

        // real size of each thread (counts mails that fall outside the current scope or filters too)
        async function fetchThreadCounts(ids, gen) {
            ids = ids.filter(id => !(id in state.threadCounts));
            if (!ids.length) return;
            try {
                const rows = await query(`SELECT ${F.thread} as thread_id FROM ${EMAIL_OBJECT_SLUG} WHERE ${F.thread} IN (${ids.map(sqlStr).join(',')}) LIMIT 5000 OFFSET 0`, EMAIL_OBJECT_SLUG);
                if (gen !== state.gen) return;
                const c = {};
                rows.forEach(r => { if (r.thread_id) c[r.thread_id] = (c[r.thread_id] || 0) + 1; });
                ids.forEach(id => { state.threadCounts[id] = c[id] || 0; });
                state.groups.forEach(g => { if (g.threadId && state.threadCounts[g.threadId]) g.count = Math.max(g.mails.length, state.threadCounts[g.threadId]); });
                renderList();
            } catch (e) { console.warn('Could not load thread sizes', e); }
        }

        async function loadMore() {
            if (state.loading || state.done) return;
            state.loading = true; state.error = '';
            const gen = state.gen;
            render();
            try {
                const rows = await fetchPage();
                if (gen !== state.gen) return;                   // reloaded meanwhile, drop the stale result
                state.offset += rows.length;
                if (rows.length < PAGE_SIZE) state.done = true;
                const kept = rows.filter(inScope);
                const hidden = rows.filter(r => !inScope(r));
                if (hidden.length) console.warn(`[emails] ${hidden.length} mail(s) came back from the query but were hidden by the exact-address check:`, hidden.map(r => ({ id: r.id, from: r.from_email, to: r.recipient_email, cc: r.cc, bcc: r.bcc })));
                console.info(`[emails] page at offset ${state.offset - rows.length}: ${rows.length} from the API, ${kept.length} shown`);
                addMails(kept);
                state.loaded = true;
                ensureDealNames(kept.flatMap(m => m._dealIds));
                fetchThreadCounts([...new Set(kept.map(m => m.thread_id).filter(Boolean))], gen);
            } catch (e) {
                if (gen !== state.gen) return;
                console.error(e);
                state.error = e.message;
            } finally {
                if (gen === state.gen) { state.loading = false; render(); }
            }
        }

        // wipe everything and query again from page 1
        function reload() {
            state.gen++;
            state.groups = []; state.groupMap = new Map(); state.threadCounts = {}; state.threads = {};
            state.offset = 0; state.done = false; state.loading = false; state.loaded = false; state.error = '';
            state.selected = null; state.expanded = new Set(); state.showMiddle = false;
            state.dealNames = {}; state.convert = {};
            if (state.attach) closeAttach();
            return loadMore();
        }

        const searchTokens = () => norm(state.filters.search).split(' ').filter(Boolean);
        const filtersActive = () => !!(searchTokens().length || state.filters.attach || dateBounds());

        function visibleGroups() {
            const tokens = searchTokens(), needAtt = state.filters.attach;
            return state.groups.filter(g => {
                if (needAtt && !g.atts) return false;
                return tokens.every(k => g.hay.includes(k));      // every word must appear somewhere in the conversation
            });
        }

        // ═══════════════════════════════════════════════════════════════
        // FORMAT HELPERS
        // ═══════════════════════════════════════════════════════════════
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const TZ = { timeZone: 'Asia/Kolkata' };
        const dayKeyOf = ms => ms ? new Date(ms).toLocaleDateString('en-CA', TZ) : 'none';

        function dayLabel(ms) {
            if (!ms) return 'No date';
            const key = dayKeyOf(ms), now = Date.now();
            if (key === dayKeyOf(now)) return 'Today';
            if (key === dayKeyOf(now - 864e5)) return 'Yesterday';
            const sameYear = key.slice(0, 4) === dayKeyOf(now).slice(0, 4);
            return new Date(ms).toLocaleDateString('en-IN', { ...TZ, weekday: 'long', day: 'numeric', month: 'long', ...(sameYear ? {} : { year: 'numeric' }) });
        }
        const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString('en-IN', { ...TZ, hour: 'numeric', minute: '2-digit', hour12: true }) : '';
        function fmtFull(v) {
            const d = toDate(v); if (!d) return '—';
            return d.toLocaleString('en-IN', { ...TZ, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) + ' IST';
        }
        // Gmail-like: time today, weekday + date within a week, date this year, full date otherwise
        function fmtGmail(v) {
            const d = toDate(v); if (!d) return '';
            const time = fmtTime(d.getTime()), now = new Date();
            if (dayKeyOf(d.getTime()) === dayKeyOf(now.getTime())) return time;
            const md = d.toLocaleDateString('en-IN', { ...TZ, day: 'numeric', month: 'short' });
            if ((now - d) / 864e5 < 7) return `${d.toLocaleDateString('en-IN', { ...TZ, weekday: 'short' })} ${md}, ${time}`;
            const yr = dayKeyOf(d.getTime()).slice(0, 4);
            return yr === dayKeyOf(now.getTime()).slice(0, 4) ? `${md}, ${time}` : `${md} ${yr}, ${time}`;
        }
        const fmtDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-IN', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' }); };
        const initial = s => (String(s).replace(/[^a-z0-9]/gi, '')[0] || '?');

        const dirOf = m => { const d = String(m.direction ?? '').toLowerCase(); return d === 'sent' || d === 'received' ? d : ''; };

        function senderParts(raw) {
            const s = String(raw ?? '').trim();
            const m = /^"?([^"<]*?)"?\s*<([^>]+)>$/.exec(s);
            if (m) return { name: m[1].trim() || m[2].trim(), addr: m[2].trim() };
            return { name: s, addr: '' };
        }

        const TINTS = [['#f8cfcd', '#550b15'], ['#fde09b', '#5f1a05'], ['#a6eb84', '#004433'], ['#c7dcfc', '#0c2c5b'], ['#a5dbe2', '#002a2e'], ['#d9d8fc', '#2b0c7b'], ['#f8d4eb', '#570e45'], ['#ffd2b1', '#4a2400']];
        function tintOf(s) { let h = 0; for (const c of String(s).toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return TINTS[h % TINTS.length]; }

        const clipSvg = (n = 15) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>`;
        const chevSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
        const chevUpSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';

        // highlight search words inside a text (safe: every piece is escaped)
        const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        function hl(text, tokens) {
            if (!tokens.length) return esc(text);
            const re = new RegExp('(' + tokens.map(reEsc).join('|') + ')', 'ig');
            return text.split(re).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join('');
        }

        // one-line hint under the subject saying WHERE the search matched when it isn't visible in the row already
        function matchHint(g, tokens) {
            if (!tokens.length) return '';
            if (tokens.every(k => g.mails.some(m => m._nMeta.includes(k)))) return '';
            for (const m of g.mails) {
                const low = m._text.toLowerCase();
                const k = tokens.find(t => low.includes(t));
                if (k) {
                    const i = low.indexOf(k), s = Math.max(0, i - 30), e = Math.min(m._text.length, i + k.length + 70);
                    return `<div class="row-snip">${s > 0 ? '…' : ''}${hl(m._text.slice(s, e), tokens)}${e < m._text.length ? '…' : ''}</div>`;
                }
            }
            for (const m of g.mails) {
                const a = m._attNames.find(n => tokens.some(t => norm(n).includes(t)));
                if (a) return `<div class="row-snip">Attachment: ${hl(a, tokens)}</div>`;
            }
            return '';
        }

        // ═══════════════════════════════════════════════════════════════
        // MAIL BODY  (sandboxed iframe: no scripts, links open in a new tab)
        // ═══════════════════════════════════════════════════════════════
        // escaped plain text -> clickable links
        function linkify(escaped) {
            return escaped.replace(/https?:\/\/[^\s<>"]+/g, m => {
                let u = m, tail = '';
                const t = u.match(/(?:&gt;|&lt;|&quot;|[).,;!?\]])+$/);
                if (t) { tail = t[0]; u = u.slice(0, u.length - tail.length); }
                return `<a href="${u}">${u}</a>${tail}`;
            });
        }

        // html_content first, then content (HTML or plain text)
        function pickBody(b) {
            const html = b.html_content && String(b.html_content).trim() ? String(b.html_content) : '';
            const text = b.content && String(b.content).trim() ? String(b.content) : '';
            const remote = s => /<img[^>]+src\s*=\s*["']?https?:/i.test(s);
            if (html) return { html, hasRemoteImg: remote(html) };
            if (text && looksHtml(text)) return { html: text, hasRemoteImg: remote(text) };
            if (text) return { html: `<div class="plain">${linkify(esc(text))}</div>`, hasRemoteImg: false };
            return { html: '<div class="none">This mail has no content.</div>', hasRemoteImg: false };
        }

        function buildDoc(b) {
            const { html } = pickBody(b);
            const img = state.showImages ? 'data: https: http:' : 'data:';
            const csp = `default-src 'none'; style-src 'unsafe-inline'; img-src ${img}; font-src data:`;
            return `<!DOCTYPE html><html><head><meta charset="utf-8">` +
                `<meta http-equiv="Content-Security-Policy" content="${csp}"><base target="_blank">` +
                `<style>body{margin:0;font:14px/1.6 Inter,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1f2937;overflow-wrap:anywhere}` +
                `img{max-width:100%;height:auto}table{max-width:100%}a{color:#175259}` +
                `blockquote{margin:8px 0 8px 4px;padding-left:12px;border-left:3px solid #e5e7eb;color:#6b7280}` +
                `.plain{white-space:pre-wrap}.none{color:#9ca3af}</style></head><body>${html}</body></html>`;
        }

        const openThread = () => { const t = state.threads[state.selected]; return t && t.status === 'ok' ? t.mails : []; };

        function mountMailBody(mid) {
            const host = [...$('read').querySelectorAll('.gm-body')].find(e => e.dataset.mid === mid);
            const m = openThread().find(x => x.id === mid);
            if (!host || !m) return;
            host.innerHTML = '';
            const fr = document.createElement('iframe');
            fr.className = 'body-frame';
            fr.title = 'Message';
            fr.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
            host.appendChild(fr);
            const fit = () => {
                try {
                    const d = fr.contentDocument;
                    if (d && d.documentElement) fr.style.height = Math.max(40, d.documentElement.scrollHeight) + 'px';
                } catch (e) { }
            };
            fr.addEventListener('load', () => {
                fit();
                try { new ResizeObserver(fit).observe(fr.contentDocument.documentElement); } catch (e) { }
                try { fr.contentDocument.addEventListener('click', closeFilters); } catch (e) { }   // click inside a mail = outside the popover
            });
            fr.srcdoc = buildDoc(m);
        }

        // ═══════════════════════════════════════════════════════════════
        // DEALS  (name + link when the mail has a deal, "Convert to deal" when it has none)
        // ═══════════════════════════════════════════════════════════════
        const DEAL_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';
        const PLUS_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
        const CHECK_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        const DEAL_TINTS = [['#e0f2fe', '#075985'], ['#fce7f3', '#9d174d'], ['#ede9fe', '#5b21b6'], ['#fef3c7', '#92400e'], ['#dcfce7', '#166534'], ['#ffedd5', '#9a3412']];
        const dealTint = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return DEAL_TINTS[h % DEAL_TINTS.length]; };

        // names of the deals linked to the loaded mails (one query for all the ids not known yet)
        async function ensureDealNames(ids) {
            ids = [...new Set(ids)].filter(id => id && !(id in state.dealNames) && !state.dealPending.has(id));
            if (!ids.length) return;
            ids.forEach(id => state.dealPending.add(id));
            try {
                const cols = DEAL_LABEL_FIELDS.map((f, i) => `${f} as deal_label_${i}`).join(', ');
                const rows = await query(`SELECT id, ${cols} FROM ${DEAL_OBJECT_SLUG} WHERE id IN (${ids.map(sqlStr).join(',')}) LIMIT ${ids.length} OFFSET 0`, DEAL_OBJECT_SLUG);
                rows.forEach(r => {
                    const label = DEAL_LABEL_FIELDS.map((f, i) => String(r['deal_label_' + i] ?? '').trim()).find(Boolean);
                    state.dealNames[r.id] = label || r.id;
                });
                ids.forEach(id => { if (!(id in state.dealNames)) state.dealNames[id] = id; });   // deal not found: show its id
                state.dealVer++;
            } catch (e) {
                console.warn('Could not load deal names', e);                                       // chips fall back to the id
            } finally {
                ids.forEach(id => state.dealPending.delete(id));
            }
            renderList();
            renderRead();
        }

        function dealLinkHtml(id) {
            const label = id in state.dealNames ? state.dealNames[id] : (state.dealPending.has(id) ? 'Deal…' : id);
            const [bg, fg] = dealTint(id);
            return `<a class="deal-chip" href="${esc(DEAL_URL(id))}" target="_blank" rel="noopener noreferrer" style="background:${bg};color:${fg}" title="Open deal: ${esc(label)}">${DEAL_ICON}<span>${esc(label)}</span></a>`;
        }

        // what the user is told after clicking "Convert to deal" (the webhook answers one of three ways)
        const CONVERT_MSG = {
            created: 'Deal created successfully',
            existing: 'There is an open deal on this contact already, hence no deal is created and the activity is posted.',
            failed: 'Something went wrong',
        };
        const convStatus = key => (state.convert[key] || {}).status || 'idle';
        const convTitle = key => (state.convert[key] || {}).msg || 'Create a deal for this contact';
        function convertBtnInner(key) {
            const s = convStatus(key);
            if (s === 'sending') return '<span class="mini-spin"></span> Converting…';
            if (s === 'created') return CHECK_ICON + ' Deal created';
            if (s === 'existing') return CHECK_ICON + ' Activity posted';
            if (s === 'sent') return CHECK_ICON + ' Request sent';
            if (s === 'error') return 'Failed — retry';
            return PLUS_ICON + ' Convert to deal';
        }
        const convertBtnDisabled = key => ['sending', 'created', 'existing', 'sent'].includes(convStatus(key));
        const convertBtnHtml = (key, emailId, threadId) =>
            `<button type="button" class="convert-btn ${convStatus(key)}" data-convert="${esc(key)}" data-email="${esc(emailId)}" data-thread="${esc(threadId || '')}" ${convertBtnDisabled(key) ? 'disabled' : ''} title="${esc(convTitle(key))}">${convertBtnInner(key)}</button>`;

        const LINK_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
        const attachBtnHtml = (key, emailId, threadId) =>
            `<button type="button" class="attach-btn" data-attach="${esc(key)}" data-email="${esc(emailId)}" data-thread="${esc(threadId || '')}" title="Attach this conversation to one of this contact's deals">${LINK_ICON} Attach to deal</button>`;

        // deal chips when the mail(s) have a deal, otherwise "Convert to deal" + "Attach to deal" (each button keeps its own state)
        const dealAreaHtml = (ids, key, emailId, threadId) => ids.length ? ids.map(dealLinkHtml).join('') : convertBtnHtml(key, emailId, threadId) + attachBtnHtml(key, emailId, threadId);

        // update only the button(s) of this key, in place (keeps scroll position and open mail bodies)
        function syncConvertButtons(key) {
            document.querySelectorAll('.convert-btn').forEach(b => {
                if (b.dataset.convert !== key) return;
                b.className = 'convert-btn ' + convStatus(key);
                b.disabled = convertBtnDisabled(key);
                b.title = convTitle(key);
                b.innerHTML = convertBtnInner(key);
            });
        }

        // after a successful request, re-read email_deals of the loaded mails: the automation may have linked them to the new deal
        async function refreshMailDeals() {
            try {
                const byId = new Map();
                const add = m => { const a = byId.get(m.id) || []; a.push(m); byId.set(m.id, a); };
                state.groups.forEach(g => g.mails.forEach(add));
                Object.values(state.threads).forEach(t => { if (t.status === 'ok') t.mails.forEach(add); });
                const ids = [...byId.keys()];
                for (let i = 0; i < ids.length; i += 200) {
                    const part = ids.slice(i, i + 200);
                    const rows = await query(`SELECT id, ${F.deals} as email_deals FROM ${EMAIL_OBJECT_SLUG} WHERE id IN (${part.map(sqlStr).join(',')}) LIMIT ${part.length} OFFSET 0`, EMAIL_OBJECT_SLUG);
                    rows.forEach(r => (byId.get(r.id) || []).forEach(m => { m.email_deals = r.email_deals; m._dealIds = idList(r.email_deals); }));
                }
                state.groups.forEach(refreshGroup);
                const all = [...byId.values()].flat().flatMap(m => m._dealIds);
                state.dealVer++;
                await ensureDealNames(all);
                renderList();
                renderRead();
            } catch (e) { console.warn('Could not refresh deals', e); }
        }

        // Reads the webhook answer. It is not always valid JSON (the deal id sits in quotes inside "message"), so it falls back to the raw text.
        // A message you configure in the webhook is shown as it is; the automation's default wording is replaced by CONVERT_MSG.
        //   success true  + "deal created…"                  -> created
        //   success true  + "activity posted…" (open deal)    -> existing
        //   success false (e.g. no contact: "deal not created") or anything else -> failed
        const findId = t => (String(t).match(/[A-Za-z0-9]{4,}_[A-Za-z0-9]{6,}/) || [])[0] || '';
        function parseConvertResponse(raw) {
            const text = String(raw ?? '');
            let body = null; try { body = JSON.parse(text); } catch (e) { }
            const isObj = body && typeof body === 'object';
            const success = isObj ? String(body.success).toLowerCase() === 'true' : /"success"\s*:\s*"?true"?/i.test(text);
            const message = isObj && body.message != null ? String(body.message) : text;
            if (!success) return { kind: 'failed' };
            // the message the webhook wants shown: record ids, unresolved {placeholders} and stray quotes taken out
            const own = isObj ? message : ((/["']?message["']?\s*:\s*"?([\s\S]*?)"?\s*\}?\s*$/i.exec(text) || [])[1] || '');
            let clean = own.replace(/\{[^}]*\}/g, ' ').replace(/[A-Za-z0-9]{4,}_[A-Za-z0-9]{6,}/g, ' ').replace(/["“”]/g, ' ')
                .replace(/\s+/g, ' ').replace(/[\s,;:]+$/, '').trim();
            clean = clean ? clean.charAt(0).toUpperCase() + clean.slice(1) : '';
            const stock = /^(deal created successfully|activity posted on deal)\.?$/i.test(clean);   // the automation's default wording, not one you configured
            const extra = { text: clean, stock };
            if (/deal created/i.test(message)) return { kind: 'created', dealId: findId(message), ...extra };
            if (/activity posted|open deal|already/i.test(message)) return { kind: 'existing', dealId: findId(message), ...extra };
            return { kind: 'done', ...extra };                    // success, but a message we do not know: treat as sent
        }

        // One webhook, two actions. The payload always carries the same keys:
        //   action_type "convert_to_deal" -> deal_id is empty        action_type "attach_deal" -> deal_id is the deal picked in the modal
        async function callWebhook({ action, emailId, threadId, dealId }) {
            const r = await fetch(CONVERT_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contact_id: scopeId,
                    contact_email: contactAddrs[0],
                    email_id: emailId,
